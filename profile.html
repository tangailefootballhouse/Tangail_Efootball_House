<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Tangail Efootball House</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07090e] text-gray-100 font-['Inter',sans-serif] min-h-screen pb-24">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-card mx-2 my-2 px-4 py-3 flex items-center justify-between border border-gray-800">
    <a href="index.html" class="text-xs text-amber-400 font-bold flex items-center gap-1 hover:underline">
      ← Store
    </a>
    <h1 class="text-xs font-extrabold text-amber-400 tracking-wide uppercase">MY PROFILE</h1>
    <div class="w-12"></div>
  </header>

  <main class="container mx-auto px-4 pt-20 max-w-lg space-y-5">
    
    <!-- User Overview Card -->
    <section class="glass-card p-6 rounded-2xl border border-gray-800 text-center space-y-3 relative overflow-hidden">
      <div class="w-16 h-16 mx-auto rounded-full border-2 border-amber-400/40 p-1 bg-black/40 flex items-center justify-center">
        <span id="avatar-initial" class="text-2xl font-black text-amber-400">?</span>
      </div>
      <div>
        <h2 id="profile-email" class="text-xs font-extrabold text-white font-mono">Loading user...</h2>
        <p id="profile-role" class="text-[10px] text-gray-400 mt-1 uppercase font-bold tracking-wider">Customer Account</p>
      </div>
      <div class="pt-2 border-t border-gray-800 flex justify-around text-center">
        <div>
          <p class="text-[10px] text-gray-400 font-bold uppercase">Wallet Balance</p>
          <p id="profile-wallet" class="text-sm font-black text-amber-400">0 Points</p>
        </div>
      </div>
    </section>

    <!-- Fast Navigation Hub -->
    <section class="glass-card p-4 rounded-2xl border border-gray-800 space-y-2">
      <h3 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider mb-3 px-1">Quick Links</h3>
      
      <a href="orders-history.html" class="flex items-center justify-between bg-[#121722] p-3 rounded-xl border border-gray-800 hover:border-amber-400/30 transition-all">
        <span class="text-xs font-bold text-white">📦 My Orders History</span>
        <span class="text-xs text-gray-500">→</span>
      </a>

      <a href="wallet.html" class="flex items-center justify-between bg-[#121722] p-3 rounded-xl border border-gray-800 hover:border-amber-400/30 transition-all">
        <span class="text-xs font-bold text-white">💰 Store Points Wallet</span>
        <span class="text-xs text-gray-500">→</span>
      </a>

      <!-- Super Admin Dynamic Button (Hidden by default) -->
      <a href="admin.html" id="admin-hub-link" class="hidden flex items-center justify-between bg-amber-400/10 border border-amber-400/30 p-3 rounded-xl hover:bg-amber-400/20 transition-all">
        <span class="text-xs font-extrabold text-amber-400">⚡ Super Admin Panel</span>
        <span class="text-xs text-amber-400">→</span>
      </a>
    </section>

    <!-- Logout Button -->
    <button id="logout-btn" class="w-full bg-red-500/10 border border-red-500/20 hover:bg-red-500 hover:text-white text-red-400 font-extrabold text-xs py-3.5 rounded-xl transition-all uppercase tracking-wider shadow-md">
      Log Out Account
    </button>

  </main>

  <!-- Bottom Navigation -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-800 px-6 py-2">
    <div class="max-w-md mx-auto flex justify-between items-center text-center">
      <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Store</span></a>
      <a href="orders-history.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Orders</span></a>
      <a href="wallet.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Wallet</span></a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-amber-400 font-bold"><span class="text-[10px]">Profile</span></a>
    </div>
  </footer>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
