<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Tangail eFootball House</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container { max-width: 420px; margin: 40px auto; padding: 0 14px; }
        .tab-btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--primary-cyan); color: #000; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="section-card">
            <div class="tab-btn-group">
                <button class="tab-btn active" id="loginTabBtn">Login</button>
                <button class="tab-btn" id="signupTabBtn">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2 style="margin-bottom:15px; font-size:18px;">Account Login</h2>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password" required>
                </div>
                <button type="submit" class="buy-now-btn" id="loginSubmitBtn">Login</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form">
                <h2 style="margin-bottom:15px; font-size:18px;">Create New Account</h2>
                <div class="form-group">
                    <label>User Name / ID</label>
                    <input type="text" id="signupName" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="01700000000" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="tel" id="signupWhatsapp" placeholder="01700000000" required>
                </div>
                <div class="form-group">
                    <label>Password (At least 6 chars)</label>
                    <input type="password" id="signupPass" placeholder="Create password" minlength="6" required>
                </div>
                <button type="submit" class="buy-now-btn" id="signupSubmitBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Tab Switcher
        document.getElementById('loginTabBtn').addEventListener('click', () => {
            document.getElementById('loginTabBtn').classList.add('active');
            document.getElementById('signupTabBtn').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('signupForm').classList.remove('active');
        });

        document.getElementById('signupTabBtn').addEventListener('click', () => {
            document.getElementById('signupTabBtn').classList.add('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('signupForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
        });

        // Sign Up Execution
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupSubmitBtn');
            btn.disabled = true; btn.innerText = "Creating Account...";

            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPass').value;
            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const whatsapp = document.getElementById('signupWhatsapp').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    phone: phone,
                    whatsapp: whatsapp,
                    createdAt: new Date()
                });

                alert("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.disabled = false; btn.innerText = "Create Account";
            }
        });

        // Login Execution
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true; btn.innerText = "Logging in...";

            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("লগইন সফল হয়েছে!");
                window.location.href = "index.html";
            } catch (error) {
                alert("ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!");
            } finally {
                btn.disabled = false; btn.innerText = "Login";
            }
        });
    </script>
</body>
</html>
