<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account | Tangail eFootball House</title>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,.45);
        }

        .logo-title {
            text-align: center;
            color: var(--accent);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 22px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(56,189,248,.15);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 6px;
            color: var(--accent);
            font-size: 12px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 7px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .toggle {
            text-align: center;
            margin-top: 17px;
            color: var(--muted);
            font-size: 13px;
        }

        .toggle span {
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 14px;
            font-size: 12px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.4);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(16,185,129,.12);
            border: 1px solid rgba(16,185,129,.4);
            color: #6ee7b7;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            margin-top: 10px;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo-title">
        Tangail eFootball House
    </div>

    <div class="subtitle">
        Secure Customer Account
    </div>

    <h2 id="formTitle">Sign In</h2>

    <div id="messageBox" class="message"></div>

    <form id="authForm">

        <!-- USER ID -->
        <div class="form-group" id="userIdGroup" style="display:none;">
            <label>User ID / Username *</label>
            <input
                type="text"
                id="userId"
                placeholder="Enter your User ID"
                autocomplete="username"
            >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email Address *</label>
            <input
                type="email"
                id="authEmail"
                placeholder="example@gmail.com"
                required
                autocomplete="email"
            >
        </div>

        <!-- WHATSAPP -->
        <div class="form-group" id="whatsappGroup" style="display:none;">
            <label>WhatsApp Number *</label>
            <input
                type="tel"
                id="whatsapp"
                placeholder="016XXXXXXXX"
                autocomplete="tel"
            >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label>Password *</label>

            <input
                type="password"
                id="authPassword"
                placeholder="Minimum 6 characters"
                required
                autocomplete="current-password"
            >

            <span
                class="forgot"
                id="forgotBtn"
            >
                Forgot Password?
            </span>
        </div>

        <button
            type="submit"
            id="submitBtn"
        >
            Sign In
        </button>

    </form>

    <div class="toggle">
        <span id="toggleQuestion">
            Don't have an account?
        </span>

        <span id="toggleBtn">
            Register
        </span>
    </div>

    <button
        class="back-btn"
        id="backBtn"
        type="button"
    >
        ← Back to Website
    </button>

</div>


<script type="module">

    /* ==========================================
       FIREBASE IMPORTS
    ========================================== */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {
        apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
        authDomain: "tangail-efootball-house.firebaseapp.com",
        projectId: "tangail-efootball-house",
        storageBucket: "tangail-efootball-house.firebasestorage.app",
        messagingSenderId: "774313430680",
        appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
    };


    /* ==========================================
       INITIALIZE FIREBASE
    ========================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ==========================================
       ELEMENTS
    ========================================== */

    const authForm =
        document.getElementById("authForm");

    const formTitle =
        document.getElementById("formTitle");

    const submitBtn =
        document.getElementById("submitBtn");

    const toggleBtn =
        document.getElementById("toggleBtn");

    const toggleQuestion =
        document.getElementById("toggleQuestion");

    const userIdGroup =
        document.getElementById("userIdGroup");

    const whatsappGroup =
        document.getElementById("whatsappGroup");

    const forgotBtn =
        document.getElementById("forgotBtn");

    const messageBox =
        document.getElementById("messageBox");

    const backBtn =
        document.getElementById("backBtn");


    let registerMode = false;


    /* ==========================================
       MESSAGE FUNCTION
    ========================================== */

    function showMessage(message, type = "error") {

        messageBox.textContent = message;

        messageBox.className =
            "message " + type;

    }


    function clearMessage() {

        messageBox.textContent = "";

        messageBox.className =
            "message";

    }


    /* ==========================================
       SWITCH LOGIN / REGISTER
    ========================================== */

    toggleBtn.addEventListener("click", () => {

        registerMode = !registerMode;

        clearMessage();

        if (registerMode) {

            formTitle.textContent =
                "Create Account";

            submitBtn.textContent =
                "Register";

            toggleQuestion.textContent =
                "Already have an account?";

            toggleBtn.textContent =
                "Sign In";

            userIdGroup.style.display =
                "block";

            whatsappGroup.style.display =
                "block";

            forgotBtn.style.display =
                "none";

            document.getElementById("userId").required =
                true;

            document.getElementById("whatsapp").required =
                true;

        } else {

            formTitle.textContent =
                "Sign In";

            submitBtn.textContent =
                "Sign In";

            toggleQuestion.textContent =
                "Don't have an account?";

            toggleBtn.textContent =
                "Register";

            userIdGroup.style.display =
                "none";

            whatsappGroup.style.display =
                "none";

            forgotBtn.style.display =
                "block";

            document.getElementById("userId").required =
                false;

            document.getElementById("whatsapp").required =
                false;
        }

    });


    /* ==========================================
       REGISTER / LOGIN
    ========================================== */

    authForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        clearMessage();

        submitBtn.disabled = true;

        submitBtn.textContent =
            registerMode
                ? "Creating Account..."
                : "Signing In...";

        try {

            const email =
                document
                    .getElementById("authEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("authPassword")
                    .value;

            /* ==============================
               REGISTER
            ============================== */

            if (registerMode) {

                const userId =
                    document
                        .getElementById("userId")
                        .value
                        .trim();

                const whatsapp =
                    document
                        .getElementById("whatsapp")
                        .value
                        .trim();


                if (!userId) {

                    throw new Error(
                        "User ID is required."
                    );

                }


                if (!whatsapp) {

                    throw new Error(
                        "WhatsApp number is required."
                    );

                }


                if (password.length < 6) {

                    throw new Error(
                        "Password must contain at least 6 characters."
                    );

                }


                /* CREATE FIREBASE ACCOUNT */

                const result =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    result.user;


                /* SAVE CUSTOMER PROFILE */

                await setDoc(
                    doc(
                        db,
                        "users",
                        firebaseUser.uid
                    ),
                    {
                        uid: firebaseUser.uid,

                        userId: userId,

                        email: email,

                        whatsapp: whatsapp,

                        createdAt:
                            serverTimestamp()
                    }
                );


                /* SAVE LOCAL USER INFO */

                localStorage.setItem(
                    "eFootballUser",
                    JSON.stringify({
                        uid: firebaseUser.uid,
                        userId: userId,
                        email: email,
                        whatsapp: whatsapp
                    })
                );


                showMessage(
                    "Account created successfully! Redirecting...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "index.html";

                }, 800);


            }

            /* ==============================
               LOGIN
            ============================== */

            else {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    result.user;


                localStorage.setItem(
                    "eFootballUser",
                    JSON.stringify({
                        uid: firebaseUser.uid,
                        email: firebaseUser.email
                    })
                );


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "index.html";

                }, 600);

            }

        }

        catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            let message =
                error.message || "Something went wrong.";


            /* Firebase-friendly messages */

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message =
                    "এই Email দিয়ে ইতিমধ্যে একটি account আছে। Sign In করুন.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "সঠিক Email Address দিন.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message =
                    "Password কমপক্ষে ৬ characters হতে হবে.";

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Email অথবা Password ভুল.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "এই Email দিয়ে কোনো account পাওয়া যায়নি.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Password ভুল.";

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                message =
                    "Firebase Authentication-এ Email/Password sign-in চালু নেই.";

            }


            showMessage(message);

        }

        finally {

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                registerMode
                    ? "Register"
                    : "Sign In";

        }

    });


    /* ==========================================
       FORGOT PASSWORD
    ========================================== */

    forgotBtn.addEventListener(
        "click",
        async () => {

            clearMessage();

            const email =
                document
                    .getElementById("authEmail")
                    .value
                    .trim();


            if (!email) {

                showMessage(
                    "প্রথমে আপনার registered email লিখুন."
                );

                document
                    .getElementById("authEmail")
                    .focus();

                return;

            }


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset link আপনার email-এ পাঠানো হয়েছে. Inbox/Spam check করুন.",
                    "success"
                );

            }

            catch (error) {

                console.error(
                    error
                );

                showMessage(
                    error.message
                );

            }

        }
    );


    /* ==========================================
       BACK TO WEBSITE
    ========================================== */

    backBtn.addEventListener(
        "click",
        () => {

            window.location.href =
                "index.html";

        }
    );

</script>

</body>
</html>
