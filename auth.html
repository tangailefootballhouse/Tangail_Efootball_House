<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Authentication — Tangail Efootball House</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07090e] text-gray-100 font-sans flex items-center justify-center min-h-screen p-4 antialiased">

  <main class="w-full max-w-md glass-card p-6 sm:p-8 rounded-3xl border border-amber-500/20 shadow-2xl relative overflow-hidden">
    <!-- Header -->
    <div class="text-center mb-8">
      <img src="assets/logo.png" alt="Logo" class="w-16 h-16 mx-auto mb-3 rounded-2xl border border-amber-400/30 object-contain">
      <h1 class="text-xl font-black text-white">Tangail Efootball House</h1>
      <p class="text-xs text-gray-400 mt-1">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="flex bg-[#07090e] p-1 rounded-xl mb-6 border border-gray-800">
      <button id="tab-login" class="flex-1 py-2 text-xs font-bold rounded-lg text-amber-400 bg-[#0f1420] transition">Login</button>
      <button id="tab-signup" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Email Address</label>
        <input type="email" id="login-email" required placeholder="yourname@gmail.com" class="auth-input">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="auth-input">
      </div>
      <div class="text-right">
        <button type="button" id="btn-forgot" class="text-[11px] text-amber-400 hover:underline">Forgot Password?</button>
      </div>
      <button type="submit" class="btn-gold w-full text-xs font-black py-3">LOGIN</button>
    </form>

    <!-- Sign Up Form (Hidden by default) -->
    <form id="signup-form" class="space-y-4 hidden">
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Full Name</label>
        <input type="text" id="signup-name" required placeholder="আপনার নাম" class="auth-input">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Email Address</label>
        <input type="email" id="signup-email" required placeholder="yourname@gmail.com" class="auth-input">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">WhatsApp Number</label>
        <input type="tel" id="signup-phone" required placeholder="01700000000" class="auth-input">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Password</label>
        <input type="password" id="signup-password" required placeholder="••••••••" class="auth-input">
      </div>
      <button type="submit" class="btn-gold w-full text-xs font-black py-3">CREATE ACCOUNT</button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-gray-500 hover:text-amber-400 transition">← Back to Store</a>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
