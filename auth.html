<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Tangail eFootball House</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        button:hover { opacity: 0.9; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; }
        .toggle-text span { color: var(--accent); cursor: pointer; font-weight: bold; }
        .forgot-link { text-align: right; display: block; font-size: 12px; color: var(--accent); margin-top: 5px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="formTitle">Sign In</h2>
        
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter full name">
            </div>

            <div class="form-group" id="phoneGroup" style="display: none;">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" placeholder="017XXXXXXXX">
            </div>

            <div class="form-group" id="waGroup" style="display: none;">
                <label>WhatsApp Number</label>
                <input type="tel" id="regWhatsapp" placeholder="017XXXXXXXX">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
                <a class="forgot-link" id="forgotPassBtn">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <div class="toggle-text">
            <span id="toggleText">Don't have an account? <b id="toggleBtn" style="color:var(--accent);">Register</b></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;

        const formTitle = document.getElementById("formTitle");
        const submitBtn = document.getElementById("submitBtn");
        const toggleBtn = document.getElementById("toggleBtn");
        const nameGroup = document.getElementById("nameGroup");
        const phoneGroup = document.getElementById("phoneGroup");
        const waGroup = document.getElementById("waGroup");
        const forgotPassBtn = document.getElementById("forgotPassBtn");

        toggleBtn.addEventListener("click", () => {
            isRegisterMode = !isRegisterMode;
            if(isRegisterMode) {
                formTitle.innerText = "Create Account";
                submitBtn.innerText = "Register";
                toggleBtn.innerText = "Sign In";
                nameGroup.style.display = "block";
                phoneGroup.style.display = "block";
                waGroup.style.display = "block";
                forgotPassBtn.style.display = "none";
            } else {
                formTitle.innerText = "Sign In";
                submitBtn.innerText = "Sign In";
                toggleBtn.innerText = "Register";
                nameGroup.style.display = "none";
                phoneGroup.style.display = "none";
                waGroup.style.display = "none";
                forgotPassBtn.style.display = "block";
            }
        });

        // Forgot Password Action
        forgotPassBtn.addEventListener("click", async () => {
            const email = prompt("আপনার রেজিস্টার্ড ইমেইল এড্রেসটি লিখুন:");
            if(email) {
                try {
                    await sendPasswordResetEmail(auth, email.trim());
                    alert("পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে! ইনবক্স/স্প্যাম ফোল্ডার চেক করুন।");
                } catch(e) {
                    alert("এরর: " + e.message);
                }
            }
        });

        // Form Submit Login / Register
        document.getElementById("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value;

            try {
                if(isRegisterMode) {
                    const name = document.getElementById("regName").value;
                    const phone = document.getElementById("regPhone").value;
                    const whatsapp = document.getElementById("regWhatsapp").value;

                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        name, phone, whatsapp, email,
                        createdAt: new Date()
                    });
                    alert("অ্যাকাউন্ট তৈরি সফল হয়েছে!");
                    window.location.href = "index.html";
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("লগইন সফল হয়েছে!");
                    window.location.href = "index.html";
                }
            } catch (err) {
                alert("ব্যর্থ হয়েছে: " + err.message);
            }
        });
    </script>
</body>
</html>
