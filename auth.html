<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Tangail eFootball House</title>

    <style>
        :root {
            --bg: #0a0f1d;
            --card: #171f33;
            --accent: #00f2fe;
            --blue: #4facfe;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255,255,255,0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(0,242,254,.10), transparent 40%),
                radial-gradient(circle at bottom left, rgba(79,172,254,.10), transparent 40%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 410px;
            background: rgba(23,31,51,.92);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 15px 50px rgba(0,0,0,.45);
            backdrop-filter: blur(15px);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,var(--accent),var(--blue));
            color: #000;
            font-size: 25px;
            font-weight: 900;
        }

        h2 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0a0f1d;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0,242,254,.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-pass {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent);
            font-size: 11px;
            cursor: pointer;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 6px;
            color: var(--accent);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }

        .main-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg,var(--accent),var(--blue));
            color: #000;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 7px;
        }

        .main-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .switch-text {
            text-align: center;
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .switch-btn {
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            margin-left: 4px;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 12px;
            text-align: center;
        }

        .error {
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);
            color: #f87171;
        }

        .success {
            background: rgba(16,185,129,.12);
            border: 1px solid rgba(16,185,129,.3);
            color: #34d399;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">⚽</div>

    <h2 id="formTitle">Sign In</h2>

    <div class="subtitle">
        Tangail eFootball House
    </div>

    <div id="messageBox" class="message"></div>

    <form id="authForm">

        <!-- USERNAME / ID -->
        <div class="form-group hidden" id="usernameGroup">
            <label>Username / User ID *</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
            >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email Address *</label>
            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
                autocomplete="email"
            >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label>Password *</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    required
                    minlength="6"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="show-pass"
                    id="showPasswordBtn"
                >
                    Show
                </button>
            </div>

            <a class="forgot" id="forgotBtn">
                Forgot Password?
            </a>
        </div>

        <!-- WHATSAPP -->
        <div class="form-group hidden" id="whatsappGroup">
            <label>WhatsApp Number *</label>

            <input
                type="tel"
                id="whatsapp"
                placeholder="01603785413"
                inputmode="tel"
            >
        </div>

        <button
            type="submit"
            class="main-btn"
            id="submitBtn"
        >
            Sign In
        </button>

    </form>

    <div class="switch-text">
        <span id="switchQuestion">
            Don't have an account?
        </span>

        <span
            class="switch-btn"
            id="switchBtn"
        >
            Sign Up
        </span>
    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",

        authDomain:
            "tangail-efootball-house.firebaseapp.com",

        projectId:
            "tangail-efootball-house",

        storageBucket:
            "tangail-efootball-house.firebasestorage.app",

        messagingSenderId:
            "774313430680",

        appId:
            "1:774313430680:web:07d5af9f2abc31be4fcaed"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const authForm =
        document.getElementById("authForm");

    const formTitle =
        document.getElementById("formTitle");

    const submitBtn =
        document.getElementById("submitBtn");

    const switchBtn =
        document.getElementById("switchBtn");

    const switchQuestion =
        document.getElementById("switchQuestion");

    const usernameGroup =
        document.getElementById("usernameGroup");

    const whatsappGroup =
        document.getElementById("whatsappGroup");

    const forgotBtn =
        document.getElementById("forgotBtn");

    const showPasswordBtn =
        document.getElementById("showPasswordBtn");

    const messageBox =
        document.getElementById("messageBox");


    let registerMode = false;


    /* =========================
       MESSAGE FUNCTION
    ========================= */

    function showMessage(message, type = "error") {

        messageBox.textContent = message;

        messageBox.className =
            "message " + type;

        messageBox.style.display = "block";
    }


    function hideMessage() {

        messageBox.style.display = "none";
    }


    /* =========================
       SWITCH LOGIN / SIGNUP
    ========================= */

    switchBtn.addEventListener("click", function () {

        registerMode = !registerMode;

        hideMessage();

        authForm.reset();

        if (registerMode) {

            formTitle.textContent =
                "Create Account";

            submitBtn.textContent =
                "Create Account";

            switchQuestion.textContent =
                "Already have an account?";

            switchBtn.textContent =
                "Sign In";

            usernameGroup.classList.remove("hidden");

            whatsappGroup.classList.remove("hidden");

            forgotBtn.style.display =
                "none";

            document
                .getElementById("username")
                .required = true;

            document
                .getElementById("whatsapp")
                .required = true;

        } else {

            formTitle.textContent =
                "Sign In";

            submitBtn.textContent =
                "Sign In";

            switchQuestion.textContent =
                "Don't have an account?";

            switchBtn.textContent =
                "Sign Up";

            usernameGroup.classList.add("hidden");

            whatsappGroup.classList.add("hidden");

            forgotBtn.style.display =
                "block";

            document
                .getElementById("username")
                .required = false;

            document
                .getElementById("whatsapp")
                .required = false;
        }

    });


    /* =========================
       SHOW / HIDE PASSWORD
    ========================= */

    showPasswordBtn.addEventListener(
        "click",
        function () {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

                showPasswordBtn.textContent =
                    "Hide";

            } else {

                password.type = "password";

                showPasswordBtn.textContent =
                    "Show";
            }

        }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotBtn.addEventListener(
        "click",
        async function () {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            if (!email) {

                showMessage(
                    "Please enter your email address first."
                );

                document
                    .getElementById("email")
                    .focus();

                return;
            }

            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );

                showMessage(
                    "Password reset link has been sent to your email. Please check Inbox/Spam.",
                    "success"
                );

            } catch (error) {

                showMessage(
                    firebaseError(error)
                );

            }

        }
    );


    /* =========================
       AUTH FORM SUBMIT
    ========================= */

    authForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessage();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            /* =====================
               SIGN UP
            ===================== */

            if (registerMode) {

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();

                const whatsapp =
                    document
                        .getElementById("whatsapp")
                        .value
                        .trim();


                if (!username) {

                    showMessage(
                        "Please enter your User ID / Username."
                    );

                    return;
                }


                if (!email) {

                    showMessage(
                        "Please enter your email."
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters."
                    );

                    return;
                }


                if (!whatsapp) {

                    showMessage(
                        "Please enter your WhatsApp number."
                    );

                    return;
                }


                try {

                    submitBtn.disabled = true;

                    submitBtn.textContent =
                        "Creating Account...";


                    const result =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        result.user;


                    /* SAVE USER PROFILE */

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {
                            uid: user.uid,
                            userId: username,
                            email: email,
                            whatsapp: whatsapp,
                            createdAt: new Date()
                        }
                    );


                    /* UPDATE FIREBASE PROFILE */

                    try {

                        await updateProfile(
                            user,
                            {
                                displayName:
                                    username
                            }
                        );

                    } catch (e) {
                        console.log(
                            "Profile update skipped"
                        );
                    }


                    showMessage(
                        "Account created successfully! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );


                } catch (error) {

                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "Create Account";

                    showMessage(
                        firebaseError(error)
                    );

                }


            }

            /* =====================
               SIGN IN
            ===================== */

            else {

                if (!email || !password) {

                    showMessage(
                        "Please enter email and password."
                    );

                    return;
                }


                try {

                    submitBtn.disabled = true;

                    submitBtn.textContent =
                        "Signing In...";


                    const result =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    /* Make sure profile exists */

                    const user =
                        result.user;

                    const userRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );

                    const userSnap =
                        await getDoc(userRef);


                    if (!userSnap.exists()) {

                        await setDoc(
                            userRef,
                            {
                                uid: user.uid,
                                email: user.email,
                                userId:
                                    user.displayName ||
                                    "User",
                                whatsapp: "",
                                createdAt: new Date()
                            }
                        );

                    }


                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        700
                    );


                } catch (error) {

                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "Sign In";

                    showMessage(
                        firebaseError(error)
                    );

                }

            }

        }
    );


    /* =========================
       FIREBASE ERROR HANDLER
    ========================= */

    function firebaseError(error) {

        switch (error.code) {

            case "auth/email-already-in-use":
                return "This email is already registered. Please Sign In.";

            case "auth/invalid-email":
                return "Please enter a valid email address.";

            case "auth/weak-password":
                return "Password must contain at least 6 characters.";

            case "auth/
