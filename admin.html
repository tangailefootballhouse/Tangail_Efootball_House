<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard — Tangail Efootball House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07090e] text-gray-100 font-['Inter',sans-serif] min-h-screen">

  <!-- Top Admin Bar -->
  <header class="bg-[#0f131d] border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <img src="logo.png" class="h-8 w-8 object-contain rounded-full border border-amber-400/30">
      <h1 class="text-sm font-extrabold text-amber-400 tracking-wide">SUPER ADMIN DASHBOARD</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="admin-email" class="text-xs text-gray-400 font-mono">Verifying...</span>
      <button id="admin-logout-btn" class="bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white text-xs px-3 py-1.5 rounded-lg transition-all font-bold">
        Logout
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-6xl space-y-8">

    <!-- Section 1: Add New Game -->
    <section class="glass-card p-6 rounded-2xl border border-gray-800">
      <h2 class="text-sm font-extrabold text-amber-400 uppercase tracking-wider mb-4">1. Add Game (First Screen)</h2>
      <form id="add-game-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="game-name" placeholder="Game Name (e.g. eFootball)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="text" id="game-logo" placeholder="Logo Image URL / Filename (logo.png)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="text" id="game-banner" placeholder="Banner Image URL / Filename (banner.jpg)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="number" id="game-order" placeholder="Display Order (1, 2, 3)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <textarea id="game-desc" placeholder="Short Description" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none md:col-span-2" rows="2"></textarea>
        <div class="flex items-center gap-4 md:col-span-2">
          <label class="flex items-center gap-2 text-xs text-gray-300">
            <input type="checkbox" id="game-active" checked class="accent-amber-400"> Active Status
          </label>
          <label class="flex items-center gap-2 text-xs text-gray-300">
            <input type="checkbox" id="game-coming-soon" class="accent-amber-400"> Coming Soon
          </label>
        </div>
        <button type="submit" class="bg-amber-400 hover:bg-amber-500 text-black font-extrabold text-xs py-3 rounded-lg md:col-span-2 transition-all">
          SAVE GAME
        </button>
      </form>
    </section>

    <!-- Section 2: Add New Service -->
    <section class="glass-card p-6 rounded-2xl border border-gray-800">
      <h2 class="text-sm font-extrabold text-amber-400 uppercase tracking-wider mb-4">2. Add Service (e.g. Coins, Starter Pack)</h2>
      <form id="add-service-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <select id="service-game-id" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none text-gray-300 md:col-span-2" required>
          <option value="">Select Game...</option>
        </select>
        <input type="text" id="service-name" placeholder="Service Name (e.g. eFootball Coins)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="text" id="service-banner" placeholder="Service Banner Image Name/URL" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none">
        <button type="submit" class="bg-amber-400 hover:bg-amber-500 text-black font-extrabold text-xs py-3 rounded-lg md:col-span-2 transition-all">
          SAVE SERVICE
        </button>
      </form>
    </section>

    <!-- Section 3: Add Package -->
    <section class="glass-card p-6 rounded-2xl border border-gray-800">
      <h2 class="text-sm font-extrabold text-amber-400 uppercase tracking-wider mb-4">3. Add Package (Product)</h2>
      <form id="add-package-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <select id="package-service-id" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none text-gray-300 md:col-span-2" required>
          <option value="">Select Service...</option>
        </select>
        <input type="text" id="pkg-name" placeholder="Package Name (e.g. 1040 Coins)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="text" id="pkg-image" placeholder="Package Image (e.g. Casilas.png)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none">
        <input type="number" id="pkg-price" placeholder="Regular Price (৳)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none" required>
        <input type="number" id="pkg-offer-price" placeholder="Offer Price (৳)" class="bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs focus:border-amber-400 outline-none">
        
        <div class="md:col-span-2 border-t border-gray-800 pt-4 mt-2">
          <p class="text-xs font-bold text-gray-400 mb-2">Dynamic Requirements Fields:</p>
          <div class="flex flex-wrap gap-4 text-xs text-gray-300">
            <label class="flex items-center gap-1.5"><input type="checkbox" id="req-konami-id" class="accent-amber-400"> Konami ID Required</label>
            <label class="flex items-center gap-1.5"><input type="checkbox" id="req-konami-pass" class="accent-amber-400"> Konami Password Required</label>
            <label class="flex items-center gap-1.5"><input type="checkbox" id="req-trx-id" class="accent-amber-400" checked> Transaction ID Required</label>
            <label class="flex items-center gap-1.5"><input type="checkbox" id="req-wallet" class="accent-amber-400" checked> Allow Wallet Payment</label>
            <label class="flex items-center gap-1.5"><input type="checkbox" id="req-whatsapp" class="accent-amber-400" checked> Allow WhatsApp Order</label>
          </div>
        </div>

        <button type="submit" class="bg-amber-400 hover:bg-amber-500 text-black font-extrabold text-xs py-3 rounded-lg md:col-span-2 transition-all">
          SAVE PACKAGE
        </button>
      </form>
    </section>

  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
