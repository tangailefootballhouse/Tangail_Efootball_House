<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TANGAIL eFOOTBALL</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }

        .container { max-width: 900px; margin: 0 auto; }
        h2, h3 { color: var(--accent-color); text-align: center; }

        /* Login Screen */
        .login-box {
            background: var(--card-bg); max-width: 380px; margin: 100px auto; padding: 30px;
            border-radius: 10px; border: 1px solid var(--border-color); text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 15px 0; background: #080d1d;
            border: 1px solid var(--border-color); border-radius: 6px; color: #fff; box-sizing: border-box;
        }
        .login-box button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;
        }

        /* Top Bar */
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;
        }
        .btn-logout {
            background: #ef4444; color: #fff; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        /* Section Cards */
        .section-title {
            color: var(--accent-color); font-size: 18px; margin: 25px 0 15px 0;
            border-left: 4px solid var(--accent-color); padding-left: 10px;
        }

        .order-card, .user-card {
            background: var(--card-bg); border-radius: 8px; padding: 18px;
            margin-bottom: 20px; border: 1px solid var(--border-color);
        }
        
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px; font-size: 13px; color: var(--text-muted); margin: 12px 0;
        }
        .grid span { color: #fff; font-weight: 500; }

        select {
            background: #080d1d; color: #fff; padding: 8px 12px;
            border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer;
        }

        /* Chat UI */
        .chat-box {
            background: #080d1d; height: 120px; overflow-y: auto; padding: 10px;
            border-radius: 6px; margin-top: 12px; font-size: 13px; border: 1px solid var(--border-color);
        }
        .chat-msg { margin-bottom: 6px; }
        .chat-msg.user { color: var(--accent-color); text-align: left; }
        .chat-msg.admin { color: #10b981; text-align: right; }
        
        .chat-input { display: flex; gap: 8px; margin-top: 8px; }
        .chat-input input {
            flex: 1; padding: 8px; border-radius: 6px;
            border: 1px solid var(--border-color); background: #080d1d; color: #fff;
        }
        .chat-input button {
            background: var(--accent-color); border: none; padding: 8px 16px;
            border-radius: 6px; color: #000; font-weight: bold; cursor: pointer;
        }

        /* User Table/List */
        .user-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .user-table th, .user-table td {
            text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color);
        }
        .user-table th { color: var(--accent-color); background: #080d1d; }
    </style>
</head>
<body>

    <!-- Admin Login Lock Screen -->
    <div class="login-box" id="adminLoginBox">
        <h3 style="margin-top:0;">Admin Portal</h3>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button id="adminLoginBtn">Login</button>
    </div>

    <!-- Admin Dashboard Workspace -->
    <div class="container" id="adminDashboard" style="display: none;">
        <div class="admin-header">
            <h2 style="margin: 0;">Admin Management Dashboard</h2>
            <button class="btn-logout" id="logoutAdminBtn">Logout</button>
        </div>

        <!-- Orders Section -->
        <div class="section-title">Customer Orders</div>
        <div id="adminOrdersContainer">Loading Orders...</div>

        <!-- Registered Users Section -->
        <div class="section-title">Registered Users</div>
        <div id="adminUsersContainer" style="background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
            Loading Registered Users...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Security Password
        const ADMIN_PASSWORD = "admin123";

        // Admin Auth Handlers
        document.getElementById("adminLoginBtn").onclick = () => {
            const inputPass = document.getElementById("adminPass").value;
            if (inputPass === ADMIN_PASSWORD) {
                sessionStorage.setItem("adminLoggedIn", "true");
                showDashboard();
            } else {
                alert("Incorrect Password!");
            }
        };

        document.getElementById("logoutAdminBtn").onclick = () => {
            sessionStorage.removeItem("adminLoggedIn");
            location.reload();
        };

        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            showDashboard();
        }

        function showDashboard() {
            document.getElementById("adminLoginBox").style.display = "none";
            document.getElementById("adminDashboard").style.display = "block";
            loadAdminOrders();
            loadRegisteredUsers();
        }

        // Fetch & Stream Customer Orders
        function loadAdminOrders() {
            onSnapshot(collection(db, "orders"), (snapshot) => {
                const container = document.getElementById("adminOrdersContainer");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted);'>No orders found.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const o = docSnap.data();
                    const orderId = docSnap.id;

                    let chatHTML = (o.messages || []).map(m => `<div class="chat-msg ${m.sender}">${m.sender === 'admin' ? 'You' : 'Customer'}: ${m.text}</div>`).join('');

                    const div = document.createElement("div");
                    div.className = "order-card";
                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                            <h3 style="margin:0; color:#38bdf8;">${o.product} (৳${o.price})</h3>
                            <div>
                                <label style="font-size:13px; color:var(--text-muted);">Status: </label>
                                <select onchange="window.updateStatus('${orderId}', this.value)">
                                    <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Completed" ${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid">
                            <div>Account Type: <span>${o.accType}</span></div>
                            <div>Payment Method: <span>${o.paymentMethod}</span></div>
                            <div>Game Email/ID: <span>${o.email}</span></div>
                            <div>Sender Number: <span>${o.senderNumber}</span></div>
                            <div>Game Password: <span>${o.password}</span></div>
                            <div>TrxID: <span>${o.trxId}</span></div>
                        </div>

                        <div class="chat-box">${chatHTML}</div>
                        <div class="chat-input">
                            <input type="text" id="adminChatIn-${orderId}" placeholder="Reply to customer...">
                            <button onclick="window.sendAdminChat('${orderId}')">Reply</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        // Fetch & Stream Registered Users
        function loadRegisteredUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const container = document.getElementById("adminUsersContainer");
                
                if (snapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted);'>No registered users found.</p>";
                    return;
                }

                let tableHTML = `
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Email</th>
                                <th>WhatsApp Number</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                snapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    tableHTML += `
                        <tr>
                            <td><strong>${u.userId || 'N/A'}</strong></td>
                            <td>${u.email || 'N/A'}</td>
                            <td><a href="https://wa.me/${u.whatsapp}" target="_blank" style="color:var(--accent-color); text-decoration:none;">${u.whatsapp || 'N/A'}</a></td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody></table>`;
                container.innerHTML = tableHTML;
            });
        }

        // Live Actions
        window.updateStatus = async (orderId, newStatus) => {
            await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            alert("Order Status Updated!");
        };

        window.sendAdminChat = async (orderId) => {
            const input = document.getElementById(`adminChatIn-${orderId}`);
            if (!input.value.trim()) return;

            await updateDoc(doc(db, "orders", orderId), {
                messages: arrayUnion({ sender: "admin", text: input.value.trim(), time: new Date() })
            });
            input.value = "";
        };
    </script>
</body>
</html>
