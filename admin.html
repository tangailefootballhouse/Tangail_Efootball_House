<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { color: #38bdf8; text-align: center; }
        .order-card { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 20px; border-left: 4px solid #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; color: #94a3b8; }
        .grid span { color: #fff; }
        select { background: #0f172a; color: #fff; padding: 6px; border-radius: 4px; border: 1px solid #334155; }
        
        .chat-box { background: #080d1d; height: 100px; overflow-y: auto; padding: 8px; border-radius: 5px; margin-top: 10px; font-size: 12px; }
        .chat-msg.user { color: #38bdf8; text-align: left; }
        .chat-msg.admin { color: #10b981; text-align: right; }
        .chat-input { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input input { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .chat-input button { background: #38bdf8; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Order Management Dashboard</h2>
        <div id="adminOrdersContainer">Loading Orders...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Orders for Admin
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const container = document.getElementById("adminOrdersContainer");
            container.innerHTML = "";

            snapshot.forEach((docSnap) => {
                const o = docSnap.data();
                const orderId = docSnap.id;

                let chatHTML = (o.messages || []).map(m => `<div class="chat-msg ${m.sender}">${m.sender === 'admin' ? 'You' : 'User'}: ${m.text}</div>`).join('');

                const div = document.createElement("div");
                div.className = "order-card";
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h3 style="margin:0; color:#38bdf8;">${o.product} (৳${o.price})</h3>
                        <div>
                            <label>Status: </label>
                            <select onchange="window.updateStatus('${orderId}', this.value)">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                <option value="Completed" ${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid">
                        <div>Account Type: <span>${o.accType}</span></div>
                        <div>Payment Method: <span>${o.paymentMethod}</span></div>
                        <div>Email/ID: <span>${o.email}</span></div>
                        <div>Sender Number: <span>${o.senderNumber}</span></div>
                        <div>Password: <span>${o.password}</span></div>
                        <div>TrxID: <span>${o.trxId}</span></div>
                    </div>

                    <!-- Chat Box -->
                    <div class="chat-box">${chatHTML}</div>
                    <div class="chat-input">
                        <input type="text" id="adminChatIn-${orderId}" placeholder="Reply to customer...">
                        <button onclick="window.sendAdminChat('${orderId}')">Reply</button>
                    </div>
                `;
                container.appendChild(div);
            });
        });

        // Update Status Logic
        window.updateStatus = async (orderId, newStatus) => {
            await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            alert("Order Status Updated!");
        };

        // Send Chat from Admin
        window.sendAdminChat = async (orderId) => {
            const input = document.getElementById(`adminChatIn-${orderId}`);
            if (!input.value.trim()) return;

            await updateDoc(doc(db, "orders", orderId), {
                messages: arrayUnion({ sender: "admin", text: input.value.trim(), time: new Date() })
            });
            input.value = "";
        };
    </script>
</body>
</html>
