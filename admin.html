<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard — Tangail Efootball House</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07090e] text-gray-100 font-sans min-h-screen pb-12 antialiased">

  <header class="p-4 border-b border-gray-800 bg-[#0f1420] flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-sm font-black text-amber-400">ADMIN CONTROL PANEL</h1>
      <p class="text-[10px] text-gray-400" id="admin-email">Loading...</p>
    </div>
    <a href="index.html" class="text-xs text-gray-400 hover:text-white border border-gray-800 px-3 py-1.5 rounded-lg">Store View</a>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <section class="glass-card p-4 space-y-3">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex justify-between items-center">
        <span>Wallet Top-Up Requests</span>
        <span id="topup-count" class="bg-amber-400/10 text-amber-400 text-[10px] px-2 py-0.5 rounded-full border border-amber-400/20">0</span>
      </h2>
      <div id="admin-topup-list" class="space-y-2 text-xs">
        <div class="text-center py-4 text-gray-500">লোড হচ্ছে...</div>
      </div>
    </section>

    <section class="glass-card p-4 space-y-3">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex justify-between items-center">
        <span>Customer Orders</span>
        <span id="orders-count" class="bg-amber-400/10 text-amber-400 text-[10px] px-2 py-0.5 rounded-full border border-amber-400/20">0</span>
      </h2>
      <div id="admin-orders-list" class="space-y-2 text-xs">
        <div class="text-center py-4 text-gray-500">লোড হচ্ছে...</div>
      </div>
    </section>

    <section class="glass-card p-4 space-y-4">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Add New Product / Package</h2>
      <form id="form-add-package" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1 font-bold">Package Title</label>
          <input type="text" id="pkg-name" required placeholder="e.g. 1040 eFootball Coins" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-400 mb-1 font-bold">Price (Points/BDT)</label>
            <input type="number" id="pkg-price" required placeholder="800" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-gray-400 mb-1 font-bold">Badge Text (Optional)</label>
            <input type="text" id="pkg-badge" placeholder="e.g. POPULAR" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
          </div>
        </div>
        <button type="submit" class="btn-gold w-full py-2.5 font-bold">PUBLISH PACKAGE</button>
      </form>
    </section>

  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
