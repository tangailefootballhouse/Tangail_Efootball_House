<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard | Tangail eFootball House</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --border: #334155; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .auth-box { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; max-width: 350px; width: 90%; }
        .admin-container { max-width: 1200px; margin: 0 auto; display: none; }
        h1, h2 { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
        .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; width: auto; margin: 0; border-radius: 4px; font-size: 11px; }
        .btn-reset { background: #eab308; color: #000; padding: 6px 12px; width: auto; margin: 0; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 12px; }
        th { background: #0f172a; color: var(--accent); }
        .status-select { padding: 4px; font-weight: bold; border-radius: 4px; font-size: 11px; width: auto; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-box">
            <h2>🔒 Admin Security Lock</h2>
            <p style="font-size: 12px; color: #94a3b8;">Enter Master Password</p>
            <input type="password" id="adminPassInput" placeholder="Enter Password">
            <button id="loginAdminBtn">Unlock Dashboard</button>
        </div>
    </div>

    <div class="admin-container" id="adminDashboard">
        <h1>Super Admin Control Panel</h1>

        <div class="grid">
            <div class="card">
                <h2>Update Store Banner</h2>
                <form id="bannerForm">
                    <label>Banner Link / File Name</label>
                    <input type="text" id="bannerUrlInput" placeholder="starterpack.png or full URL" required>
                    <button type="submit">Update Banner Live</button>
                </form>
            </div>

            <div class="card">
                <h2>Add Coin Package</h2>
                <form id="pkgForm">
                    <label>Package Title</label>
                    <input type="text" id="pkgTitle" placeholder="e.g. 520 Coins" required>
                    <label>Price (TK)</label>
                    <input type="number" id="pkgPrice" placeholder="e.g. 480" required>
                    <label>Package Image Link / File Name</label>
                    <input type="text" id="pkgImage" placeholder="starterpack.png or full URL">
                    <button type="submit">Add Package</button>
                </form>
            </div>

            <div class="card">
                <h2>Manage Active Packages</h2>
                <div id="packageList">Loading packages...</div>
            </div>
        </div>

        <div class="card">
            <h2>Registered Customers Database</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>User Name</th><th>Email</th><th>Phone</th><th>WhatsApp</th><th>Action</th></tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Customer Orders List</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Date</th><th>User Profile</th><th>Game Account</th><th>Package</th><th>Payment</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_PIN = "admin1234";

        document.getElementById("loginAdminBtn").addEventListener("click", () => {
            if (document.getElementById("adminPassInput").value === ADMIN_PIN) {
                document.getElementById("authOverlay").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                loadDashboardData();
            } else { alert("ভুল পাসওয়ার্ড!"); }
        });

        function loadDashboardData() {
            document.getElementById("bannerForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                await setDoc(doc(db, "settings", "banner"), { url: document.getElementById("bannerUrlInput").value });
                alert("ব্যানার আপডেট করা হয়েছে!");
            });

            document.getElementById("pkgForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                await addDoc(collection(db, "products"), {
                    title: document.getElementById("pkgTitle").value,
                    price: Number(document.getElementById("pkgPrice").value),
                    image: document.getElementById("pkgImage").value || 'starterpack.png'
                });
                alert("প্যাকেজ যোগ করা হয়েছে!");
                document.getElementById("pkgForm").reset();
            });

            onSnapshot(collection(db, "products"), (snapshot) => {
                const list = document.getElementById("packageList");
                list.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const div = document.createElement("div");
                    div.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#0f172a; padding:8px; border-radius:6px;";
                    div.innerHTML = `<span><b>${item.title}</b> - ৳${item.price}</span> <button class="btn-danger" onclick="deletePackage('${docSnap.id}')">Delete</button>`;
                    list.appendChild(div);
                });
            });

            onSnapshot(collection(db, "users"), (snapshot) => {
                const usersTable = document.getElementById("usersTableBody");
                usersTable.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${user.name || 'N/A'}</td><td>${user.email || 'N/A'}</td><td>${user.phone || 'N/A'}</td><td>${user.whatsapp || 'N/A'}</td><td><button class="btn-reset" onclick="resetUserPassword('${user.email}')">Reset Pass</button> <button class="btn-danger" onclick="deleteUser('${docSnap.id}')">Remove</button></td>`;
                    usersTable.appendChild(tr);
                });
            });

            onSnapshot(collection(db, "orders"), async (snapshot) => {
                const tableBody = document.getElementById("ordersTableBody");
                tableBody.innerHTML = "";
                for (const docSnap of snapshot.docs) {
                    const order = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>N/A</td><td>${order.userId || 'Guest'}</td><td>${order.email}<br>${order.password}</td><td>${order.product}</td><td>${order.paymentMethod}<br>Trx: ${order.trxId}</td><td><select class="status-select" onchange="updateOrderStatus('${docSnap.id}', this.value)"><option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option><option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option></select></td><td><button class="btn-danger" onclick="deleteOrder('${docSnap.id}')">Delete</button></td>`;
                    tableBody.appendChild(tr);
                }
            });
        }

        window.resetUserPassword = (email) => { sendPasswordResetEmail(auth, email).then(() => alert("ইমেইলে রিসেট লিঙ্ক পাঠানো হয়েছে!")); };
        window.deletePackage = async (id) => { if(confirm("ডিলিট করতে চান?")) await deleteDoc(doc(db, "products", id)); };
        window.deleteUser = async (id) => { if(confirm("ডিলিট করতে চান?")) await deleteDoc(doc(db, "users", id)); };
        window.updateOrderStatus = async (id, status) => { await updateDoc(doc(db, "orders", id), { status }); };
        window.deleteOrder = async (id) => { if(confirm("ডিলিট করতে চান?")) await deleteDoc(doc(db, "orders", id)); };
    </script>
</body>
</html>
