<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard V2 | Tangail Efootball House</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(22, 31, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 20px; min-height: 100vh; }

        .container { max-width: 1000px; margin: 0 auto; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); }
        .admin-title { font-size: 20px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Stats Bar */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 16px; border-radius: var(--radius-md); text-align: center; }
        .stat-val { font-size: 24px; font-weight: 800; color: var(--accent-glow); margin-top: 4px; }

        /* Management Sections */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px; backdrop-filter: blur(8px); }
        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--accent-glow); }

        label { font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-top: 10px; }
        input, select {
            width: 100%; padding: 10px 12px; margin-top: 6px; margin-bottom: 8px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: var(--radius-sm); color: #fff; outline: none; font-size: 13px;
        }

        .btn-action {
            width: 100%; padding: 12px; background: var(--accent-gradient); border: none;
            border-radius: var(--radius-sm); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* Orders Section */
        .order-card { background: rgba(255,255,255,0.02); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; font-size: 13px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 10px; }
        
        .status-select { width: auto; padding: 4px 8px; margin: 0; font-size: 11px; font-weight: 700; border-radius: 20px; }
        
        .order-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: var(--text-secondary); margin-bottom: 10px; }
        .order-details strong { color: var(--text-primary); }

        /* Chat System */
        .chat-box { background: rgba(0,0,0,0.3); height: 100px; overflow-y: auto; padding: 8px; border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--card-border); }
        .chat-msg { margin-bottom: 4px; font-size: 11px; }
        .chat-msg.admin { color: var(--accent-glow); text-align: right; }
        .chat-msg.user { color: var(--success); text-align: left; }

        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--accent-gradient); color: #fff; padding: 10px 20px;
            border-radius: 30px; font-size: 13px; font-weight: 700; display: none; z-index: 400;
        }
    </style>
</head>
<body>

    <div class="toast-msg" id="toast">Saved!</div>

    <div class="container">
        <!-- Header -->
        <div class="admin-header">
            <div class="admin-title">Admin Dashboard V2</div>
            <span style="font-size: 12px; color: var(--text-secondary);">Tangail Efootball House</span>
        </div>

        <!-- Live Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size:12px; color:var(--text-secondary);">Total Orders</div>
                <div class="stat-val" id="statOrders">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:12px; color:var(--text-secondary);">Pending Orders</div>
                <div class="stat-val" id="statPending" style="color:var(--warning);">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:12px; color:var(--text-secondary);">Total Products</div>
                <div class="stat-val" id="statProducts">0</div>
            </div>
        </div>

        <!-- System Settings & Product Upload -->
        <div class="grid-layout">
            <!-- Add Product -->
            <div class="panel">
                <div class="panel-title">Add New Product</div>
                <form id="addProductForm">
                    <label>Product Title</label>
                    <input type="text" id="prodTitle" placeholder="e.g. 1040 Coins" required>

                    <label>Price (BDT)</label>
                    <input type="number" id="prodPrice" placeholder="e.g. 850" required>

                    <label>Image URL</label>
                    <input type="text" id="prodImg" placeholder="starterpack.png">

                    <button type="submit" class="btn-action">Publish Product</button>
                </form>
            </div>

            <!-- Notice & Banner Settings -->
            <div class="panel">
                <div class="panel-title">Banner & Notice Config</div>
                <form id="settingsForm">
                    <label>Notice Message</label>
                    <input type="text" id="noticeText" placeholder="e.g. Delivery time 5-10 minutes">

                    <label>Banner Image URL</label>
                    <input type="text" id="bannerUrl" placeholder="Image URL">

                    <button type="submit" class="btn-action">Save Settings</button>
                </form>
            </div>
        </div>

        <!-- Orders List -->
        <div class="panel">
            <div class="panel-title">Customer Orders</div>
            <div id="ordersContainer">Loading Orders...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, arrayUnion, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showToast(text) {
            const t = document.getElementById("toast");
            t.innerText = text;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 3000);
        }

        // Add Product Form
        document.getElementById("addProductForm").onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "products"), {
                title: document.getElementById("prodTitle").value,
                price: Number(document.getElementById("prodPrice").value),
                image: document.getElementById("prodImg").value || "starterpack.png"
            });
            document.getElementById("addProductForm").reset();
            showToast("Product Published!");
        };

        // Save Banner and Notice
        document.getElementById("settingsForm").onsubmit = async (e) => {
            e.preventDefault();
            const notice = document.getElementById("noticeText").value;
            const banner = document.getElementById("bannerUrl").value;

            if (notice) await setDoc(doc(db, "settings", "notice"), { text: notice });
            if (banner) await setDoc(doc(db, "settings", "banner"), { url: banner });
            
            showToast("Settings Updated!");
        };

        // Stream Products Stats
        onSnapshot(collection(db, "products"), (snap) => {
            document.getElementById("statProducts").innerText = snap.size;
        });

        // Stream Realtime Orders
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";

            let pendingCount = 0;
            document.getElementById("statOrders").innerText = snapshot.size;

            if (snapshot.empty) {
                container.innerHTML = "<p style='color:var(--text-secondary); text-align:center;'>No orders placed yet.</p>";
                return;
            }

            snapshot.forEach((docSnap) => {
                const o = docSnap.data();
                const id = docSnap.id;

                if (o.status === "Pending") pendingCount++;

                let chatHTML = (o.messages || []).map(m => `<div class="chat-msg ${m.sender}">${m.sender === 'admin' ? 'You' : 'User'}: ${m.text}</div>`).join('');

                const card = document.createElement("div");
                card.className = "order-card";
                card.innerHTML = `
                    <div class="order-header">
                        <strong>${o.product} — ৳${o.price}</strong>
                        <select class="status-select" onchange="window.updateStatus('${id}', this.value)">
                            <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                            <option value="Completed" ${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </div>

                    <div class="order-details">
                        <div>Account Type: <strong>${o.accType}</strong></div>
                        <div>Payment Method: <strong>${o.paymentMethod}</strong></div>
                        <div>Email/ID: <strong>${o.email}</strong></div>
                        <div>Sender No: <strong>${o.senderNumber}</strong></div>
                        <div>Password: <strong>${o.password}</strong></div>
                        <div>TrxID: <strong>${o.trxId}</strong></div>
                    </div>

                    <div class="chat-box">${chatHTML}</div>
                    <div style="display:flex; gap:6px;">
                        <input type="text" id="adminChat-${id}" placeholder="Type reply..." style="margin:0;">
                        <button class="btn-action" style="margin:0; width:auto; padding:6px 14px;" onclick="window.sendAdminChat('${id}')">Send</button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("statPending").innerText = pendingCount;
        });

        // Update Order Status
        window.updateStatus = async (orderId, newStatus) => {
            await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            showToast("Status Updated!");
        };

        // Send Chat Reply
        window.sendAdminChat = async (orderId) => {
            const input = document.getElementById(`adminChat-${orderId}`);
            if (!input.value.trim()) return;
            await updateDoc(doc(db, "orders", orderId), {
                messages: arrayUnion({ sender: "admin", text: input.value.trim(), time: new Date() })
            });
            input.value = "";
        };
    </script>
</body>
</html>
