<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tangail Efootball House</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }

        .container { max-width: 900px; margin: 0 auto; }
        h2, h3 { color: var(--accent-color); text-align: center; }

        /* Login Modal Screen */
        .login-box {
            background: var(--card-bg); max-width: 380px; margin: 80px auto; padding: 30px;
            border-radius: 10px; border: 1px solid var(--border-color); text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 15px 0; background: #080d1d;
            border: 1px solid var(--border-color); border-radius: 6px; color: #fff; box-sizing: border-box;
        }
        .login-box button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;
        }

        /* Header */
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;
        }
        .btn-logout {
            background: var(--danger-color); color: #fff; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        .section-title {
            color: var(--accent-color); font-size: 18px; margin: 25px 0 15px 0;
            border-left: 4px solid var(--accent-color); padding-left: 10px;
        }

        .card {
            background: var(--card-bg); border-radius: 8px; padding: 18px;
            margin-bottom: 20px; border: 1px solid var(--border-color);
        }

        /* Forms & Inputs */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
        input, select {
            width: 100%; padding: 10px; background: #080d1d; border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; box-sizing: border-box;
        }
        .btn-action {
            background: var(--accent-color); color: #000; border: none; padding: 10px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .btn-delete { background: var(--danger-color); color: #fff; }

        /* Package Management List */
        .package-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid var(--border-color); gap: 10px;
        }
        .package-item img { height: 40px; border-radius: 4px; }

        /* Orders & Chat */
        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; font-size: 13px; color: var(--text-muted); margin: 10px 0; }
        .grid-info span { color: #fff; }
        .chat-box { background: #080d1d; height: 100px; overflow-y: auto; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 12px; }
        .chat-msg.user { color: var(--accent-color); text-align: left; }
        .chat-msg.admin { color: var(--success-color); text-align: right; }
        .chat-input { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>

    <!-- Strict Login Portal -->
    <div class="login-box" id="adminLoginBox">
        <h3 style="margin-top:0;">Admin Access Required</h3>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button id="adminLoginBtn">Login</button>
    </div>

    <!-- Main Workspace (Hidden by Default) -->
    <div class="container" id="adminDashboard" style="display: none;">
        <div class="admin-header">
            <h2 style="margin: 0;">Admin Control Panel</h2>
            <button class="btn-logout" id="logoutAdminBtn">Logout</button>
        </div>

        <!-- 1. Banner Management -->
        <div class="section-title">Manage Banner</div>
        <div class="card">
            <div class="form-grid">
                <input type="text" id="bannerUrlInput" placeholder="Banner Image URL / File Path (e.g. starterpack.png)">
            </div>
            <button class="btn-action" id="updateBannerBtn">Update Banner Image</button>
        </div>

        <!-- 2. Add / Manage Coin Packages -->
        <div class="section-title">Add New Package</div>
        <div class="card">
            <div class="form-grid">
                <input type="text" id="pkgTitle" placeholder="Package Title (e.g. 500 Coins)">
                <input type="number" id="pkgPrice" placeholder="Price (৳)">
                <input type="text" id="pkgImage" placeholder="Image URL / File Name (Optional)">
            </div>
            <button class="btn-action" id="addPackageBtn">Add Package</button>
        </div>

        <div class="section-title">Existing Packages</div>
        <div class="card" id="packageListContainer">Loading Packages...</div>

        <!-- 3. Customer Orders -->
        <div class="section-title">Customer Orders</div>
        <div id="adminOrdersContainer">Loading Orders...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Security Lock Config
        const ADMIN_PASSWORD = "admin123";

        // Handle Login
        document.getElementById("adminLoginBtn").onclick = () => {
            const inputPass = document.getElementById("adminPass").value;
            if (inputPass === ADMIN_PASSWORD) {
                sessionStorage.setItem("adminLoggedIn", "true");
                showDashboard();
            } else {
                alert("Incorrect Password!");
            }
        };

        document.getElementById("logoutAdminBtn").onclick = () => {
            sessionStorage.removeItem("adminLoggedIn");
            location.reload();
        };

        // Check Login Session
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            showDashboard();
        }

        function showDashboard() {
            document.getElementById("adminLoginBox").style.display = "none";
            document.getElementById("adminDashboard").style.display = "block";
            loadPackages();
            loadAdminOrders();
        }

        // --- Banner Manager ---
        document.getElementById("updateBannerBtn").onclick = async () => {
            const url = document.getElementById("bannerUrlInput").value.trim();
            if (!url) return alert("Please enter a valid Banner URL or file path!");
            
            await setDoc(doc(db, "settings", "banner"), { url: url });
            alert("Banner updated successfully!");
        };

        // --- Package Manager ---
        document.getElementById("addPackageBtn").onclick = async () => {
            const title = document.getElementById("pkgTitle").value.trim();
            const price = document.getElementById("pkgPrice").value.trim();
            const image = document.getElementById("pkgImage").value.trim();

            if (!title || !price) return alert("Title and Price are required!");

            await addDoc(collection(db, "products"), {
                title: title,
                price: Number(price),
                image: image || ""
            });

            alert("Package added!");
            document.getElementById("pkgTitle").value = "";
            document.getElementById("pkgPrice").value = "";
            document.getElementById("pkgImage").value = "";
        };

        function loadPackages() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                const container = document.getElementById("packageListContainer");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No packages available.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const pId = docSnap.id;

                    const div = document.createElement("div");
                    div.className = "package-item";
                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            ${p.image ? `<img src="${p.image}">` : ''}
                            <div>
                                <strong>${p.title}</strong> - ৳${p.price}
                            </div>
                        </div>
                        <button class="btn-action btn-delete" onclick="window.deletePackage('${pId}')">Delete</button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        window.deletePackage = async (id) => {
            if (confirm("Are you sure you want to delete this package?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // --- Order & Tracking Manager ---
        function loadAdminOrders() {
            onSnapshot(collection(db, "orders"), (snapshot) => {
                const container = document.getElementById("adminOrdersContainer");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color:var(--text-muted);'>No orders placed yet.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const o = docSnap.data();
                    const orderId = docSnap.id;

                    let chatHTML = (o.messages || []).map(m => `<div class="chat-msg ${m.sender}">${m.sender === 'admin' ? 'You' : 'Customer'}: ${m.text}</div>`).join('');

                    const div = document.createElement("div");
                    div.className = "card";
                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="margin:0; color:#38bdf8;">${o.product} (৳${o.price})</h3>
                            <div>
                                <label style="font-size:12px;">Status: </label>
                                <select onchange="window.updateStatus('${orderId}', this.value)">
                                    <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Completed" ${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid-info">
                            <div>Account: <span>${o.accType}</span></div>
                            <div>Payment Method: <span>${o.paymentMethod}</span></div>
                            <div>Game Email/ID: <span>${o.email}</span></div>
                            <div>Sender Number: <span>${o.senderNumber}</span></div>
                            <div>Game Password: <span>${o.password}</span></div>
                            <div>TrxID: <span>${o.trxId}</span></div>
                        </div>

                        <div class="chat-box">${chatHTML}</div>
                        <div class="chat-input">
                            <input type="text" id="adminChatIn-${orderId}" placeholder="Reply to customer...">
                            <button class="btn-action" onclick="window.sendAdminChat('${orderId}')">Reply</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        window.updateStatus = async (orderId, newStatus) => {
            await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            alert("Order Status Updated!");
        };

        window.sendAdminChat = async (orderId) => {
            const input = document.getElementById(`adminChatIn-${orderId}`);
            if (!input.value.trim()) return;

            await updateDoc(doc(db, "orders", orderId), {
                messages: arrayUnion({ sender: "admin", text: input.value.trim(), time: new Date() })
            });
            input.value = "";
        };
    </script>
</body>
</html>
