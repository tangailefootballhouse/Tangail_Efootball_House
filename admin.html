<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Admin Dashboard | Tangail eFootball House</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        input, select, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; width: auto; margin: 0; border-radius: 4px; font-size: 11px; }
        
        /* Table Styles */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 12px; }
        th { background: #0f172a; color: var(--accent); }
        .status-select { padding: 4px; margin: 0; font-weight: bold; border-radius: 4px; font-size: 11px; width: auto; }
        .user-tag { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 11px; display: inline-block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Commercial Admin Dashboard</h1>

        <div class="grid">
            <!-- 1. Add New Package -->
            <div class="card">
                <h2>Add Coin Package</h2>
                <form id="pkgForm">
                    <label>Package Title</label>
                    <input type="text" id="pkgTitle" placeholder="e.g. 520 Coins" required>
                    <label>Price (TK)</label>
                    <input type="number" id="pkgPrice" placeholder="e.g. 480" required>
                    <button type="submit">Add Package</button>
                </form>
            </div>

            <!-- 2. Active Packages List -->
            <div class="card">
                <h2>Manage Active Packages</h2>
                <div id="packageList">Loading packages...</div>
            </div>
        </div>

        <!-- 3. Orders Management Table -->
        <div class="card">
            <h2>Customer Orders List</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>User Profile</th>
                            <th>Game Account</th>
                            <th>Package</th>
                            <th>Payment & Sender</th>
                            <th>Status Control</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="7" style="text-align:center;">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Add Package
        document.getElementById("pkgForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("pkgTitle").value;
            const price = document.getElementById("pkgPrice").value;

            try {
                await addDoc(collection(db, "products"), { title, price: Number(price) });
                alert("প্যাকেজ সফলতাভাবে যুক্ত হয়েছে!");
                document.getElementById("pkgForm").reset();
            } catch (err) { alert("Error adding package"); }
        });

        // 2. Manage Active Packages
        onSnapshot(collection(db, "products"), (snapshot) => {
            const list = document.getElementById("packageList");
            list.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;
                const div = document.createElement("div");
                div.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#0f172a; padding:8px; border-radius:6px;";
                div.innerHTML = `
                    <span><b>${item.title}</b> - ৳${item.price}</span>
                    <button class="btn-danger" onclick="deletePackage('${id}')">Delete</button>
                `;
                list.appendChild(div);
            });
        });

        window.deletePackage = async (id) => {
            if(confirm("প্যাকেজটি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // 3. Load Orders with User Profile Metadata
        onSnapshot(collection(db, "orders"), async (snapshot) => {
            const tableBody = document.getElementById("ordersTableBody");
            tableBody.innerHTML = "";

            if(snapshot.empty) {
                tableBody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>No orders received yet.</td></tr>";
                return;
            }

            for (const docSnap of snapshot.docs) {
                const order = docSnap.data();
                const orderId = docSnap.id;
                const dateStr = order.date ? new Date(order.date.seconds * 1000).toLocaleDateString('bn-BD') : 'N/A';

                // Fetch registered user profile details if userId exists
                let userInfoHtml = `<span class="user-tag">Guest / Not Logged In</span>`;
                if (order.userId && order.userId !== "Guest") {
                    try {
                        const userDoc = await getDoc(doc(db, "users", order.userId));
                        if (userDoc.exists()) {
                            const u = userDoc.data();
                            userInfoHtml = `
                                <b>Name:</b> ${u.name || 'N/A'}<br>
                                <b>Phone:</b> ${u.phone || 'N/A'}<br>
                                <b>WA:</b> ${u.whatsapp || order.whatsapp}
                            `;
                        }
                    } catch(e) {}
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${userInfoHtml}</td>
                    <td>
                        <b>Type:</b> ${order.accType}<br>
                        <b>Email:</b> ${order.email}<br>
                        <b>Pass:</b> <span style="color:#fbbf24">${order.password}</span>
                    </td>
                    <td><b>${order.product}</b></td>
                    <td>
                        <b>Method:</b> ${order.paymentMethod}<br>
                        <b>Sender:</b> ${order.senderNumber}<br>
                        <b>TrxID:</b> <span style="color:#38bdf8; font-weight:bold;">${order.trxId}</span>
                    </td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus('${orderId}', this.value)">
                            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>🟡 Pending</option>
                            <option value="Payment Received" ${order.status === 'Payment Received' ? 'selected' : ''}>🔵 Payment Received</option>
                            <option value="In Progress" ${order.status === 'In Progress' ? 'selected' : ''}>🟣 In Progress</option>
                            <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>🟢 Completed</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-danger" onclick="deleteOrder('${orderId}')">Delete</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        });

        // Live Order Status Update
        window.updateOrderStatus = async (orderId, newStatus) => {
            try {
                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            } catch (err) {
                alert("Status update failed!");
            }
        };

        // Delete Order
        window.deleteOrder = async (orderId) => {
            if(confirm("এই অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান?")) {
                await deleteDoc(doc(db, "orders", orderId));
            }
        };
    </script>
</body>
</html>
