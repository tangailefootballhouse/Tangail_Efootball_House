<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tangail Efootball House</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <button id="logout-btn">Logout</button>
    </header>

    <main class="container">
        <section class="card">
            <h3>Add New Product</h3>
            <input type="text" id="p-title" placeholder="Title (e.g. 130 Coins)">
            <input type="number" id="p-price" placeholder="Price (e.g. 120)">
            <input type="text" id="p-image" placeholder="Image Name/URL (e.g. starterpack.png)">
            <button onclick="addProduct()">Add Product</button>
        </section>

        <section class="card">
            <h3>Update Banner & Notice</h3>
            <input type="text" id="set-banner" placeholder="Banner Image URL">
            <input type="text" id="set-notice" placeholder="Notice Text">
            <button onclick="updateSettings()">Save Settings</button>
        </section>
    </main>

    <script>
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "auth.html";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            auth.signOut().then(() => window.location.href = "auth.html");
        });

        function addProduct() {
            const title = document.getElementById("p-title").value;
            const price = Number(document.getElementById("p-price").value);
            const image = document.getElementById("p-image").value;

            if(!title || !price) return alert("Fill required fields");

            db.collection("products").add({
                title: title,
                price: price,
                image: image || "starterpack.png"
            }).then(() => {
                alert("Product Added Successfully!");
                location.reload();
            });
        }

        function updateSettings() {
            const banner = document.getElementById("set-banner").value;
            const notice = document.getElementById("set-notice").value;

            db.collection("settings").doc("general").set({
                banner: banner,
                notice: notice
            }, { merge: true }).then(() => {
                alert("Settings Updated!");
            });
        }
    </script>
</body>
</html>
