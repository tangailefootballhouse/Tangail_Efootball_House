<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tangail eFootball House</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .product-list { margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .btn-del { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: auto; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Product Panel</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>Package Title</label>
                <input type="text" id="pTitle" placeholder="e.g. 1630 coins" required>
            </div>
            <div class="form-group">
                <label>Price (৳)</label>
                <input type="number" id="pPrice" placeholder="1190" required>
            </div>
            <div class="form-group">
                <label>Image Link (Leave Empty if no image)</label>
                <input type="text" id="pImage" placeholder="starterpack.png">
            </div>
            <button type="submit">Add Product</button>
        </form>

        <div class="product-list">
            <h3 style="color:#38bdf8; font-size: 16px;">Current Packages</h3>
            <div id="adminProductContainer">Loading products...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load and display products with Delete button
        onSnapshot(collection(db, "products"), (snapshot) => {
            const container = document.getElementById("adminProductContainer");
            container.innerHTML = "";

            if(snapshot.empty) {
                container.innerHTML = "<p style='color:#94a3b8;'>No products found.</p>";
                return;
            }

            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const item = document.createElement("div");
                item.className = "product-item";
                item.innerHTML = `
                    <div>
                        <strong>${p.title}</strong> - ৳${p.price}
                    </div>
                    <button class="btn-del" data-id="${docSnap.id}">Delete</button>
                `;
                container.appendChild(item);
            });

            // Add delete event listeners
            document.querySelectorAll(".btn-del").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    const docId = e.target.getAttribute("data-id");
                    if(confirm("Are you sure you want to delete this package?")) {
                        await deleteDoc(doc(db, "products", docId));
                        alert("Package deleted successfully!");
                    }
                });
            });
        });

        // Add Product Form Handler
        document.getElementById("addProductForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("pTitle").value.trim();
            const price = document.getElementById("pPrice").value.trim();
            const image = document.getElementById("pImage").value.trim();

            try {
                await addDoc(collection(db, "products"), {
                    title: title,
                    price: price,
                    image: image,
                    date: new Date()
                });
                alert("Product Added Successfully!");
                document.getElementById("addProductForm").reset();
            } catch (err) {
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
