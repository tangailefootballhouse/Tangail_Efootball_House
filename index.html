<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangail Efootball House</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; }

        /* Header Bar */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 18px; font-weight: bold; color: var(--accent-color); }
        .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }

        /* Banner & Notice */
        .banner { width: 100%; border-radius: 10px; margin-bottom: 15px; display: block; border: 1px solid var(--border-color); }
        .notice-box {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-color);
            color: var(--accent-color); padding: 10px; border-radius: 8px; font-size: 13px;
            margin-bottom: 20px; text-align: center;
        }

        /* Products Grid */
        .section-title { font-size: 16px; margin-bottom: 12px; color: var(--accent-color); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .product-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .product-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .product-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .product-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .product-price { color: var(--accent-color); font-size: 14px; font-weight: bold; }

        /* Profile & Menu Drawer Navigation */
        .drawer-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
            display: none; justify-content: flex-end;
        }
        .drawer {
            width: 80%; max-width: 320px; background: var(--card-bg); height: 100%;
            padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
            border-left: 1px solid var(--border-color);
        }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

        .profile-card { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid var(--border-color); }
        .profile-card div { margin-bottom: 5px; }

        .drawer-menu { list-style: none; }
        .drawer-item {
            padding: 12px; border-radius: 6px; margin-bottom: 8px; background: #0f172a;
            cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-color);
        }
        .drawer-item a { color: #fff; text-decoration: none; width: 100%; }

        /* Modal Screens */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300;
            display: none; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--card-bg); border-radius: 10px; width: 100%; max-width: 450px;
            padding: 20px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        
        input, select {
            width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px;
            background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; outline: none;
        }
        .btn-main {
            width: 100%; padding: 12px; background: var(--accent-color); border: none;
            border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* Purchase History Section */
        .history-card { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; border: 1px solid var(--border-color); }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-Pending { background: #eab308; color: #000; }
        .status-Processing { background: #3b82f6; color: #fff; }
        .status-Completed { background: var(--success-color); color: #fff; }
        
        .chat-box { background: #1e293b; height: 90px; overflow-y: auto; padding: 8px; border-radius: 6px; margin-top: 8px; }
        .chat-msg.user { color: var(--accent-color); text-align: right; }
        .chat-msg.admin { color: var(--success-color); text-align: left; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="brand">Tangail Efootball House</div>
        <button class="menu-btn" id="openDrawerBtn">☰</button>
    </header>

    <!-- Main Section -->
    <div class="container">
        <!-- Live Banner & Notice -->
        <img id="mainBanner" class="banner" src="starterpack.png" alt="Banner" style="display:none;">
        <div class="notice-box" id="noticeBox" style="display:none;"></div>

        <!-- Coin Products Grid -->
        <div class="section-title">Select Coin Package</div>
        <div class="product-grid" id="productGrid">Loading Packages...</div>
    </div>

    <!-- Drawer Menu -->
    <div class="drawer-overlay" id="drawerOverlay">
        <div class="drawer">
            <div class="drawer-header">
                <h3 style="color:var(--accent-color);">Profile & Settings</h3>
                <button class="close-btn" id="closeDrawerBtn">✕</button>
            </div>

            <!-- Profile Overview -->
            <div class="profile-card">
                <div><strong>User ID:</strong> <span id="profId">Loading...</span></div>
                <div><strong>Email:</strong> <span id="profEmail">Loading...</span></div>
                <div><strong>WhatsApp:</strong> <span id="profWa">Loading...</span></div>
            </div>

            <!-- Navigation Links -->
            <ul class="drawer-menu">
                <li class="drawer-item" id="btnMyOrders">📦 My Purchase History</li>
                <li class="drawer-item">
                    💬 <a href="https://wa.me/8801603785413" target="_blank">WhatsApp (01603785413)</a>
                </li>
                <li class="drawer-item">
                    🌐 <a href="https://facebook.com" target="_blank">Official Facebook Page</a>
                </li>
                <li class="drawer-item" id="btnLogout" style="color: var(--danger-color); margin-top: 20px;">🚪 Logout Account</li>
            </ul>
        </div>
    </div>

    <!-- Purchase History Modal -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--accent-color);">Purchase History</h3>
                <button class="close-btn" onclick="document.getElementById('historyModal').style.display='none'">✕</button>
            </div>
            <div id="historyListContainer">Loading History...</div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 id="orderModalTitle" style="color:var(--accent-color);">Checkout</h3>
                <button class="close-btn" onclick="document.getElementById('checkoutModal').style.display='none'">✕</button>
            </div>
            
            <form id="orderForm">
                <label>Account Type</label>
                <select id="accType" required>
                    <option value="Konami ID">Konami ID</option>
                    <option value="Google Play">Google Play</option>
                </select>

                <label>Game Email / ID</label>
                <input type="text" id="gameEmail" required placeholder="Enter game email">

                <label>Game Password</label>
                <input type="password" id="gamePassword" required placeholder="Enter game password">

                <label>Payment Method</label>
                <select id="paymentMethod" required>
                    <option value="bKash (Send Money)">bKash (01603785413)</option>
                    <option value="Nagad (Send Money)">Nagad (01603785413)</option>
                </select>

                <label>Sender Number</label>
                <input type="text" id="senderNo" required placeholder="Your payment number">

                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trxId" required placeholder="Payment TrxID">

                <button type="submit" class="btn-main">Submit Order</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, query, where, updateDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem("eFootballUser")) || null;
        let selectedProduct = null;

        // User Identity Setup
        async function setupUser() {
            if (!currentUser) {
                const uid = "USER-" + Math.floor(100000 + Math.random() * 900000);
                const email = prompt("Enter your Email to register account:") || `${uid}@gmail.com`;
                const wa = prompt("Enter your WhatsApp number:") || "01603785413";
                currentUser = { userId: uid, email: email, whatsapp: wa };
                localStorage.setItem("eFootballUser", JSON.stringify(currentUser));
                
                await setDoc(doc(db, "users", uid), currentUser);
            }
            document.getElementById("profId").innerText = currentUser.userId;
            document.getElementById("profEmail").innerText = currentUser.email;
            document.getElementById("profWa").innerText = currentUser.whatsapp;
        }
        setupUser();

        // Drawer Controls
        document.getElementById("openDrawerBtn").onclick = () => document.getElementById("drawerOverlay").style.display = "flex";
        document.getElementById("closeDrawerBtn").onclick = () => document.getElementById("drawerOverlay").style.display = "none";
        document.getElementById("btnLogout").onclick = () => {
            localStorage.removeItem("eFootballUser");
            location.reload();
        };

        // Realtime Banner & Notice
        onSnapshot(doc(db, "settings", "banner"), (d) => {
            if (d.exists() && d.data().url) {
                const b = document.getElementById("mainBanner");
                b.src = d.data().url;
                b.style.display = "block";
            }
        });

        onSnapshot(doc(db, "settings", "notice"), (d) => {
            if (d.exists() && d.data().text) {
                const n = document.getElementById("noticeBox");
                n.innerText = d.data().text;
                n.style.display = "block";
            }
        });

        // Realtime Products Listing
        onSnapshot(collection(db, "products"), (snapshot) => {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${p.image || 'starterpack.png'}" alt="Coin">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">৳${p.price}</div>
                `;
                card.onclick = () => {
                    selectedProduct = p;
                    document.getElementById("orderModalTitle").innerText = `${p.title} (৳${p.price})`;
                    document.getElementById("checkoutModal").style.display = "flex";
                };
                grid.appendChild(card);
            });
        });

        // Submit Order
        document.getElementById("orderForm").onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "orders"), {
                userId: currentUser.userId,
                userEmail: currentUser.email,
                product: selectedProduct.title,
                price: selectedProduct.price,
                accType: document.getElementById("accType").value,
                email: document.getElementById("gameEmail").value,
                password: document.getElementById("gamePassword").value,
                paymentMethod: document.getElementById("paymentMethod").value,
                senderNumber: document.getElementById("senderNo").value,
                trxId: document.getElementById("trxId").value,
                status: "Pending",
                createdAt: new Date()
            });

            alert("Order Submitted Successfully!");
            document.getElementById("checkoutModal").style.display = "none";
            document.getElementById("orderForm").reset();
        };

        // Purchase History & Chat
        document.getElementById("btnMyOrders").onclick = () => {
            document.getElementById("drawerOverlay").style.display = "none";
            document.getElementById("historyModal").style.display = "flex";

            const q = query(collection(db, "orders"), where("userId", "==", currentUser.userId));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById("historyListContainer");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color:var(--text-muted);'>No purchases found.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const o = docSnap.data();
                    const id = docSnap.id;
                    let chatHTML = (o.messages || []).map(m => `<div class="chat-msg ${m.sender}">${m.sender === 'admin' ? 'Admin' : 'You'}: ${m.text}</div>`).join('');

                    const div = document.createElement("div");
                    div.className = "history-card";
                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${o.product} (৳${o.price})</strong>
                            <span class="status-badge status-${o.status}">${o.status}</span>
                        </div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">TrxID: ${o.trxId}</div>
                        <div class="chat-box">${chatHTML}</div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <input type="text" id="custChat-${id}" placeholder="Ask admin..." style="margin:0; padding:6px;">
                            <button class="btn-main" style="margin:0; width:auto; padding:6px 12px;" onclick="window.sendUserChat('${id}')">Send</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        };

        window.sendUserChat = async (orderId) => {
            const input = document.getElementById(`custChat-${orderId}`);
            if (!input.value.trim()) return;
            await updateDoc(doc(db, "orders", orderId), {
                messages: arrayUnion({ sender: "user", text: input.value.trim(), time: new Date() })
            });
            input.value = "";
        };
    </script>
</body>
    </html>
