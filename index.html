<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangail Efootball House</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <header>
        <h1>Tangail Efootball House</h1>
    </header>

    <main class="container">
        <section id="banner-section">
            <img id="banner-img" src="" alt="Banner" style="display:none; width:100%; max-height:200px; object-fit:cover;">
        </section>

        <section id="notice-section">
            <p id="notice-text"></p>
        </section>

        <h2>Available Packages</h2>
        <div id="products-grid" class="grid">
            <p>Loading Packages...</p>
        </div>
    </main>

    <script>
        const db = firebase.firestore();

        // Load Banner & Notice
        db.collection("settings").doc("general").get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (data.banner) {
                    const img = document.getElementById("banner-img");
                    img.src = data.banner;
                    img.style.display = "block";
                }
                if (data.notice) {
                    document.getElementById("notice-text").innerText = data.notice;
                }
            }
        });

        // Load Products
        db.collection("products").get().then((querySnapshot) => {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const p = doc.data();
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.image || 'starterpack.png'}" alt="${p.title}">
                        <h3>${p.title || p.Title}</h3>
                        <p>Price: ${p.price || p.Price} BDT</p>
                        <button onclick="alert('Order Feature Available in Admin')">Buy Now</button>
                    </div>
                `;
            });
        }).catch((error) => {
            console.error("Error loading products: ", error);
        });
    </script>
</body>
</html>
