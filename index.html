<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangail Efootball House V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(22, 31, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 80px; min-height: 100vh; }

        /* Header Navigation */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 18px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.95); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

        /* Live Banner & Notice */
        .banner { width: 100%; border-radius: var(--radius-lg); margin-bottom: 16px; display: block; border: 1px solid var(--card-border); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .notice-box {
            background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2);
            color: var(--accent-glow); padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500;
            margin-bottom: 24px; text-align: center;
        }

        /* Products Grid */
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-glow); border-radius: 2px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px; }
        .product-card {
            background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(8px);
            border-radius: var(--radius-md); padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.25s ease;
            position: relative; overflow: hidden;
        }
        .product-card:hover { border-color: var(--accent-glow); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,210,255,0.15); }
        .product-card img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
        .product-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); }
        .product-price { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 15px; font-weight: 800; }

        /* Navigation Drawer */
        .drawer-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 200;
            display: none; justify-content: flex-end;
        }
        .drawer {
            width: 82%; max-width: 320px; background: #111827; height: 100%;
            padding: 24px 20px; display: flex; flex-direction: column; border-left: 1px solid var(--card-border);
        }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }

        .profile-card { background: rgba(255,255,255,0.03); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; border: 1px solid var(--card-border); font-size: 13px; }
        .profile-card div { margin-bottom: 6px; display: flex; justify-content: space-between; }
        .profile-card span { color: var(--text-secondary); }

        .drawer-menu { list-style: none; }
        .drawer-item {
            padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 10px; background: rgba(255,255,255,0.02);
            cursor: pointer; font-size: 14px; font-weight: 500; border: 1px solid var(--card-border); transition: 0.2s;
        }
        .drawer-item:hover { background: rgba(0, 210, 255, 0.08); border-color: var(--accent-glow); }
        .drawer-item a { color: #fff; text-decoration: none; display: block; width: 100%; }

        /* Modal Overlays */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 300;
            display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #111827; border-radius: var(--radius-lg); width: 100%; max-width: 440px;
            padding: 24px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        label { font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-top: 10px; }
        input, select {
            width: 100%; padding: 12px 14px; margin-top: 6px; margin-bottom: 8px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: var(--radius-sm); color: #fff; outline: none; font-size: 14px;
        }
        input:focus, select:focus { border-color: var(--accent-glow); }
        
        .btn-main {
            width: 100%; padding: 14px; background: var(--accent-gradient); border: none;
            border-radius: var(--radius-sm); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 14px;
            box-shadow: 0 4px 12px rgba(0,210,255,0.3); transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.98); }

        /* Purchase History */
        .history-card { background: rgba(255,255,255,0.03); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .status-Pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .status-Completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
        
        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--accent-gradient); color: #fff; padding: 12px 24px;
            border-radius: 30px; font-size: 13px; font-weight: 700; display: none; z-index: 400;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="toast-msg" id="toast">Notification</div>

    <!-- Header Navigation -->
    <header class="header">
        <div class="brand">Tangail Efootball House</div>
        <button class="menu-btn" id="openDrawerBtn">☰</button>
    </header>

    <!-- Main Section -->
    <div class="container">
        <!-- Live Banner & Notice -->
        <img id="mainBanner" class="banner" src="starterpack.png" alt="Banner" style="display:none;">
        <div class="notice-box" id="noticeBox" style="display:none;"></div>

        <!-- Coin Products Grid -->
        <div class="section-title">Select Coin Package</div>
        <div class="product-grid" id="productGrid">Loading Packages...</div>
    </div>

    <!-- Drawer Menu -->
    <div class="drawer-overlay" id="drawerOverlay">
        <div class="drawer">
            <div class="drawer-header">
                <h3 style="color:var(--text-primary); font-size: 16px;">User Profile</h3>
                <button class="close-btn" id="closeDrawerBtn">✕</button>
            </div>

            <div class="profile-card">
                <div><span>User ID</span> <strong id="profId" style="color:#fff;">...</strong></div>
                <div><span>Email</span> <strong id="profEmail" style="color:#fff;">...</strong></div>
                <div><span>WhatsApp</span> <strong id="profWa" style="color:#fff;">...</strong></div>

            </div>

            <ul class="drawer-menu">
                <li class="drawer-item" id="btnMyOrders">📦 Purchase History</li>
                <li class="drawer-item">
                    💬 <a href="https://wa.me/8801603785413" target="_blank">WhatsApp Support</a>

                <li class="drawer-item">
                    🌐 <a href="https://facebook.com" target="_blank">Facebook Page</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- User Profile Setup Modal -->
    <div class="modal" id="accountModal">

                <button class="close-btn" onclick="document.getElementById('accountModal').style.display='none'">✕</button>
            </div>
            <form id="accountForm">
                <label>Email Address</label>
                <input type="email" id="regEmail" required placeholder="user@gmail.com">

                <label>WhatsApp Number</label>
                <input type="tel" id="regWa" required placeholder="01603785413">

                <button type="submit" class="btn-main">Save Profile</button>
            </form>
        </div>
    </div>

    <!-- Purchase History Modal -->
    <div class="modal" id="historyModal">

                <button class="close-btn" onclick="document.getElementById('historyModal').style.display='none'">✕</button>
            </div>
            <div id="historyListContainer">Loading History...</div>
        </div>
    </div>

            </form>
        </div>

        const firebaseConfig = {

            updateProfileUI();

            document.getElementById("profEmail").innerText = currentUser.email;
            document.getElementById("profWa").innerText = currentUser.whatsapp;
        }

        function showToast(text) {
            const t = document.getElementById("toast");
            t.innerText = text;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 3000);
        }

        initUser();

        document.getElementById("btnEditProfile").onclick = () => {
            document.getElementById("drawerOverlay").style.display = "none";
            document.getElementById("regEmail").value = currentUser.email === "Not Set" ? "" : currentUser.email;
            document.getElementById("regWa").value = currentUser.whatsapp;
            document.getElementById("accountModal").style.display = "flex";
        };

        document.getElementById("accountForm").onsubmit = async (e) => {
            e.preventDefault();
            currentUser.email = document.getElementById("regEmail").value.trim();
            currentUser.whatsapp = document.getElementById("regWa").value.trim();
            localStorage.setItem("eFootballUser_v2", JSON.stringify(currentUser));

                n.style.display = "block";
            }
        });

                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${p.image || 'starterpack.png'}" alt="Coin">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">৳${p.price}</div>
                `;
                card.onclick = () => {
                    selectedProduct = p;
                    document.getElementById("orderModalTitle").innerText = `${p.title} (৳${p.price})`;
                    document.getElementById("checkoutModal").style.display = "flex";
                };
                grid.appendChild(card);
            });
        });

        document.getElementById("orderForm").onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "orders"), {
                userId: currentUser.userId,
                userEmail: currentUser.email,
                product: selectedProduct.title,
                price: selectedProduct.price,
                accType: document.getElementById("accType").value,
                email: document.getElementById("gameEmail").value,
                password: document.getElementById("gamePassword").value,

                senderNumber: document.getElementById("senderNo").value,
                trxId: document.getElementById("trxId").value,
                status: "Pending",
                createdAt: new Date()
            });

            document.getElementById("checkoutModal").style.display = "none";
            document.getElementById("orderForm").reset();
            showToast("Order Placed Successfully!");
        };
