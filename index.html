<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANGAIL eFOOTBALL</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #132247;
            --accent-color: #38bdf8;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #1e3a8a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #080d1d;
            border-bottom: 1px solid #1e293b;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .site-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            line-height: 1.2;
        }

        .site-title span {
            color: #fff;
            display: block;
            font-size: 14px;
        }

        .btn-auth {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .notice-board {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notice-tag {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .banner {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .banner img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
            border-radius: 10px;
        }

        .section-title {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        /* STRICT CLEAN CARD STYLING - NO AUTOMATIC BACKGROUND IMAGES */
        .product-card {
            background-color: var(--card-bg) !important;
            background-image: none !important;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }

        .product-card::before, .product-card::after {
            display: none !important;
            content: none !important;
        }

        .product-card.active {
            border-color: var(--accent-color);
            background-color: #1a2f63 !important;
        }

        .product-card img {
            max-width: 100%;
            height: 55px;
            object-fit: contain;
            margin-bottom: 8px;
            display: block;
        }

        .product-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .selected-package-box {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .selected-package-box strong {
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <div class="site-title">
                TANGAIL
                <span>eFOOTBALL</span>
            </div>
        </div>
        <button class="btn-auth">Login / Register</button>
    </div>

    <div class="container">
        <div class="notice-board">
            <span class="notice-tag">Notice:</span>
            <span>টাকা সেন্ড মানি করে TrxID দিন। ৫-১০ মিনিটে ফাস্ট ডেলিভারি!</span>
        </div>

        <div class="banner">
            <img id="mainBanner" src="starterpack.png" alt="Banner" onerror="this.style.display='none'">
        </div>

        <div class="section-title">1. Select Coin Package</div>
        <div class="product-grid" id="productContainer">
            <div style="grid-column: span 2; text-align: center; color: var(--text-secondary);">Loading packages...</div>
        </div>

        <div class="selected-package-box" id="selectedBox">
            No Package Selected Yet
        </div>

        <div class="section-title">2. Account Details</div>
        
        <form id="orderForm">
            <div class="form-group">
                <label>Account Type</label>
                <select class="form-control" id="accType">
                    <option value="Konami ID">Konami ID (Recommended)</option>
                    <option value="Google Play">Google Play</option>
                </select>
            </div>

            <div class="form-group">
                <label>Game Email / Login ID</label>
                <input type="text" class="form-control" id="email" placeholder="Enter Game Email" required>
            </div>

            <div class="form-group">
                <label>Game Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter Game Password" required>
            </div>

            <div class="section-title" style="margin-top: 25px;">3. Payment Method</div>

            <div class="form-group">
                <label>Select Payment Method</label>
                <select class="form-control" id="paymentMethod">
                    <option value="bKash">bKash (Send Money)</option>
                    <option value="Nagad">Nagad (Send Money)</option>
                    <option value="Rocket">Rocket (Send Money)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sender Number</label>
                <input type="text" class="form-control" id="senderNumber" placeholder="017xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>Transaction ID (TrxID)</label>
                <input type="text" class="form-control" id="trxId" placeholder="e.g. 8N7A6D5E" required>
            </div>

            <button type="submit" class="btn-submit">Submit Order</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwhxDxu2DTIvJQ1uBs1Bl14FoL06Ws1KI",
            authDomain: "tangail-efootball-house.firebaseapp.com",
            projectId: "tangail-efootball-house",
            storageBucket: "tangail-efootball-house.firebasestorage.app",
            messagingSenderId: "774313430680",
            appId: "1:774313430680:web:07d5af9f2abc31be4fcaed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedProduct = null;

        // Dynamic Banner Update
        onSnapshot(doc(db, "settings", "banner"), (docSnap) => {
            if (docSnap.exists() && docSnap.data().url) {
                const bannerImg = document.getElementById("mainBanner");
                bannerImg.src = docSnap.data().url;
                bannerImg.style.display = "block";
            }
        });

        // Dynamic Product Fetching
        onSnapshot(collection(db, "products"), (snapshot) => {
            const container = document.getElementById("productContainer");
            container.innerHTML = "";

            if(snapshot.empty) {
                container.innerHTML = `<div style="grid-column: span 2; text-align: center; color: var(--text-secondary);">No packages available</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const card = document.createElement("div");
                card.className = "product-card";

                // Checks if Image URL exists and is NOT starterpack.png
                let imageHTML = "";
                if (p.image && p.image.trim() !== "" && !p.image.includes("starterpack.png")) {
                    imageHTML = `<img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">`;
                }

                card.innerHTML = `
                    ${imageHTML}
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">৳ ${p.price}</div>
                `;

                card.addEventListener("click", () => {
                    document.querySelectorAll(".product-card").forEach(c => c.classList.remove("active"));
                    card.classList.add("active");
                    selectedProduct = p;
                    document.getElementById("selectedBox").innerHTML = `Selected: <strong>${p.title}</strong> - ৳${p.price}`;
                });

                container.appendChild(card);
            });
        });

        // Submit Order Logic
        document.getElementById("orderForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!selectedProduct) {
                alert("Please select a coin package first!");
                return;
            }

            try {
                await addDoc(collection(db, "orders"), {
                    product: selectedProduct.title,
                    price: selectedProduct.price,
                    accType: document.getElementById("accType").value,
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                    paymentMethod: document.getElementById("paymentMethod").value,
                    senderNumber: document.getElementById("senderNumber").value,
                    trxId: document.getElementById("trxId").value,
                    status: "Pending",
                    date: new Date()
                });

                alert("Order Placed Successfully!");
                document.getElementById("orderForm").reset();
                document.getElementById("selectedBox").innerHTML = "No Package Selected Yet";
                document.querySelectorAll(".product-card").forEach(c => c.classList.remove("active"));
                selectedProduct = null;
            } catch (err) {
                alert("Error placing order: " + err.message);
            }
        });
    </script>
</body>
</html>
