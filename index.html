<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Tangail Efootball House</title>
  <meta
    name="description"
    content="Tangail Efootball House — Premium eFootball and gaming services."
  >
  <meta name="theme-color" content="#08090d">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
  <img src="logo.png" alt="Tangail Efootball House Logo" class="h-10 w-10 object-contain rounded-full border border-amber-400/30">
  <div class="relative w-full rounded-2xl overflow-hidden my-4 border border-gray-800">
  <img src="banner.jpg" alt="Tangail Efootball House Banner" class="w-full h-auto max-h-48 object-cover">
  </div>
  
<body class="bg-[#07090e] text-gray-100 font-sans min-h-screen pb-24 antialiased">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800/80 bg-[#0f1420]/80 backdrop-blur-md sticky top-0 z-40 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-amber-400/10 border border-amber-400/30 flex items-center justify-center font-black text-amber-400 text-xs">
        TEH
      </div>
      <div>
        <h1 class="text-xs font-black tracking-wider text-white">TANGAIL EFOOTBALL HOUSE</h1>
        <p class="text-[9px] text-gray-400 font-semibold">Premium Gaming Service</p>
      </div>
    </div>
    <div id="header-user-info" class="flex items-center gap-2">
      <a href="auth.html" class="text-xs font-bold bg-amber-400 text-black px-3 py-1.5 rounded-lg hover:bg-amber-300 transition">Login</a>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Hero Banner -->
    <section class="glass-card p-5 relative overflow-hidden">
      <div class="space-y-2">
        <span class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/30">
          ⚡ Fast & Reliable
        </span>
        <h2 class="text-xl font-black text-white leading-tight">
          Your Gaming.<br><span class="text-amber-400">Our Service.</span>
        </h2>
        <p class="text-xs text-gray-400">
          eFootball Coins, Account Buy/Sell, and Top-up Instant Delivery.
        </p>
      </div>
    </section>

    <!-- Services / Products Grid -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">eFootball Packages</h3>
        <span class="text-[10px] text-gray-500">Instant Delivery</span>
      </div>

      <div id="services-grid" class="grid grid-cols-2 gap-3">
        <div class="text-center py-8 col-span-2 text-xs text-gray-500 bg-[#0f1420] rounded-2xl border border-gray-800">
          প্যাকেজ লোড হচ্ছে...
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 glass-nav py-2.5 px-6 flex justify-around items-center z-50">
    <a href="index.html" class="flex flex-col items-center text-amber-400 nav-item-active">
      <span class="text-xs font-bold mt-0.5">Store</span>
    </a>
    <a href="order.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Orders</span>
    </a>
    <a href="wallet.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Wallet</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Profile</span>
    </a>
  </nav>

  <!-- JavaScript Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
