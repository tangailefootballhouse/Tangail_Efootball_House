<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet — Tangail Efootball House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07090e] text-gray-100 font-['Inter',sans-serif] min-h-screen pb-24">

  <header class="fixed top-0 left-0 right-0 z-50 glass-card mx-2 my-2 px-4 py-3 flex items-center justify-between border border-gray-800">
    <h1 class="text-xs font-extrabold text-amber-400 tracking-wide uppercase">STORE WALLET</h1>
    <span id="user-email-display" class="text-[10px] text-gray-400">Loading...</span>
  </header>

  <main class="container mx-auto px-4 pt-20 max-w-lg space-y-5">
    
    <!-- Balance Card -->
    <div class="glass-card p-5 rounded-2xl border border-amber-400/20 text-center relative overflow-hidden">
      <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Available Balance</p>
      <h2 id="wallet-balance" class="text-3xl font-black text-amber-400 mt-1">0 Points</h2>
    </div>

    <!-- Buy Points Form -->
    <div class="glass-card p-5 rounded-2xl border border-gray-800 space-y-3">
      <h3 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider">Buy Store Points</h3>
      <form id="buy-points-form" class="space-y-3">
        <input type="number" id="point-amount" placeholder="Amount in BDT (e.g. 150)" class="w-full bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs text-white outline-none focus:border-amber-400" required>
        <select id="wallet-payment-method" class="w-full bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs text-white outline-none focus:border-amber-400">
          <option value="bKash">bKash (01603785413)</option>
          <option value="Nagad">Nagad (01729532403)</option>
        </select>
        <input type="text" id="wallet-trx-id" placeholder="Transaction ID (TrxID)" class="w-full bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs text-white outline-none focus:border-amber-400" required>
        <input type="text" id="wallet-sender-number" placeholder="Sender Mobile Number" class="w-full bg-[#121722] border border-gray-800 rounded-lg p-3 text-xs text-white outline-none focus:border-amber-400" required>
        <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-black font-extrabold text-xs py-3 rounded-lg shadow-md transition-all uppercase">
          Request Points
        </button>
      </form>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-800 px-6 py-2">
    <div class="max-w-md mx-auto flex justify-between items-center text-center">
      <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Store</span></a>
      <a href="order.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Orders</span></a>
      <a href="wallet.html" class="flex flex-col items-center gap-1 text-amber-400 font-bold"><span class="text-[10px]">Wallet</span></a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white"><span class="text-[10px]">Profile</span></a>
    </div>
  </footer>

  <script type="module" src="js/wallet.js"></script>
</body>
</html>
