<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wallet — Tangail Efootball House</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#07090e] text-gray-100 font-sans min-h-screen pb-24 antialiased">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800/80 bg-[#0f1420]/80 backdrop-blur-md sticky top-0 z-40 flex items-center justify-between">
    <a href="index.html" class="text-xs text-amber-400 font-bold flex items-center gap-1">← Back</a>
    <h1 class="text-sm font-black tracking-wider text-white">MY WALLET</h1>
    <div class="w-8"></div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    <!-- Balance Card -->
    <div class="glass-card p-6 border-amber-500/30 text-center relative overflow-hidden">
      <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Available Balance</p>
      <div id="wallet-balance" class="text-3xl font-black text-amber-400 my-2">0 Points</div>
      <p class="text-[10px] text-gray-500">1 Point = 1 BDT | No Expiry</p>
    </div>

    <!-- Actions Toggle -->
    <div class="flex bg-[#0f1420] p-1 rounded-xl border border-gray-800">
      <button id="btn-show-topup" class="flex-1 py-2 text-xs font-bold rounded-lg text-amber-400 bg-[#07090e] transition">Add Points</button>
      <button id="btn-show-cashout" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition">Cash Out</button>
    </div>

    <!-- Top Up Form -->
    <form id="form-topup" class="glass-card p-5 space-y-4">
      <h2 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider">Top-Up Request</h2>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Amount (BDT / Points)</label>
        <input type="number" id="topup-amount" min="10" required placeholder=" e.g. 100" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-amber-400 outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Sender Number (bKash/Nagad/Rocket)</label>
        <input type="tel" id="topup-number" required placeholder="01700000000" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-amber-400 outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Transaction ID (TrxID)</label>
        <input type="text" id="topup-trxid" required placeholder="e.g. 9J283KS82" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-amber-400 outline-none">
      </div>
      <button type="submit" class="btn-gold w-full text-xs font-black py-3">SUBMIT TOP-UP REQUEST</button>
    </form>

    <!-- Cash Out Form (Hidden by default) -->
    <form id="form-cashout" class="glass-card p-5 space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider">Cash Out Request</h2>
        <span class="text-[10px] bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-full font-bold">Fee: 10 Pts</span>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Points to Withdraw</label>
        <input type="number" id="cashout-amount" min="50" required placeholder="Minimum 50 Pts" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-amber-400 outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-bold">Receive Payment Method & Number</label>
        <input type="text" id="cashout-method" required placeholder="e.g. bKash Personal - 01700000000" class="w-full bg-[#07090e] border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-amber-400 outline-none">
      </div>
      <button type="submit" class="btn-gold w-full text-xs font-black py-3 bg-red-500 hover:bg-red-600 border-red-500">REQUEST CASHOUT</button>
    </form>

    <!-- Transaction History -->
    <div class="space-y-3">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Wallet History</h3>
      <div id="wallet-history-list" class="space-y-2">
        <div class="text-center py-6 text-xs text-gray-500 bg-[#0f1420] rounded-xl border border-gray-800">
          ইতিহাস লোড হচ্ছে...
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 glass-nav py-2.5 px-6 flex justify-around items-center z-50">
    <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Store</span>
    </a>
    <a href="order.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Orders</span>
    </a>
    <a href="wallet.html" class="flex flex-col items-center text-amber-400 nav-item-active">
      <span class="text-xs font-bold mt-0.5">Wallet</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-white">
      <span class="text-xs font-bold mt-0.5">Profile</span>
    </a>
  </nav>

  <script type="module" src="js/wallet.js"></script>
</body>
</html>
