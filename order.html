<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Order — Tangail Efootball House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07090e] text-gray-100 font-['Inter',sans-serif] min-h-screen relative pb-24">

  <!-- Header -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-card mx-2 my-2 px-4 py-3 flex items-center justify-between border border-gray-800">
    <a href="index.html" class="text-amber-400 font-bold text-xs flex items-center gap-1">
      ← Back
    </a>
    <h1 class="text-xs font-extrabold text-amber-400 tracking-wider">ORDER CHECKOUT</h1>
    <div class="w-8"></div>
  </nav>

  <main class="container mx-auto px-4 pt-20 max-w-md space-y-6">

    <!-- Selected Package Overview -->
    <div id="package-summary" class="glass-card p-4 rounded-2xl border border-amber-400/30">
      <p class="text-xs text-gray-400">প্যাকেজ লোড হচ্ছে...</p>
    </div>

    <!-- Order Form (Dynamic Requirements) -->
    <form id="checkout-form" class="glass-card p-5 rounded-2xl border border-gray-800 space-y-4">
      <h3 class="text-xs font-extrabold text-amber-400 uppercase tracking-wider border-b border-gray-800 pb-2"> Required Information</h3>

      <!-- Dynamic Fields injected by JS -->
      <div id="dynamic-fields" class="space-y-3"></div>

      <!-- Payment Method Selection -->
      <div class="pt-2">
        <label class="block text-[11px] font-bold text-gray-400 mb-2">Payment Method</label>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="border border-gray-800 p-2 rounded-xl text-center cursor-pointer hover:border-amber-400 flex flex-col items-center gap-1">
            <input type="radio" name="paymentMethod" value="bKash" class="accent-amber-400" checked>
            <span class="font-bold text-pink-500">bKash</span>
          </label>
          <label class="border border-gray-800 p-2 rounded-xl text-center cursor-pointer hover:border-amber-400 flex flex-col items-center gap-1">
            <input type="radio" name="paymentMethod" value="Nagad" class="accent-amber-400">
            <span class="font-bold text-orange-500">Nagad</span>
          </label>
          <label id="wallet-option" class="border border-gray-800 p-2 rounded-xl text-center cursor-pointer hover:border-amber-400 flex flex-col items-center gap-1">
            <input type="radio" name="paymentMethod" value="Wallet" class="accent-amber-400">
            <span class="font-bold text-amber-400">Wallet</span>
          </label>
        </div>
      </div>

      <!-- Manual Payment Details -->
      <div id="manual-payment-box" class="bg-[#121722] p-3 rounded-xl border border-gray-800 text-xs space-y-2">
        <p class="text-amber-400 font-bold">Send Money Number: <span class="text-white select-all">01603785413</span></p>
        <input type="text" id="trx-id" placeholder="Transaction ID (TrxID)" class="w-full bg-[#07090e] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:border-amber-400 outline-none">
        <input type="text" id="sender-number" placeholder="Sender Mobile Number" class="w-full bg-[#07090e] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:border-amber-400 outline-none">
      </div>

      <button type="submit" id="submit-order-btn" class="w-full bg-amber-400 hover:bg-amber-500 text-black font-extrabold text-xs py-3 rounded-xl shadow-lg transition-all">
        CONFIRM ORDER
      </button>
    </form>

    <!-- WhatsApp Support Direct Option -->
    <div id="whatsapp-box" class="hidden glass-card p-4 rounded-2xl border border-green-500/30 text-center space-y-2">
      <p class="text-xs text-gray-300">Konami পাসওয়ার্ড ছাড়া দ্রুত অর্ডার করতে সরাসরি WhatsApp এ কথা বলুন:</p>
      <a id="whatsapp-link" href="#" target="_blank" class="inline-flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-black font-extrabold text-xs px-4 py-2 rounded-xl w-full transition-all">
        Order via WhatsApp
      </a>
    </div>

  </main>

  <script type="module" src="js/order.js"></script>
</body>
</html>
